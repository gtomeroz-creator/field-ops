<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול אנשי שטח — הרי נצרת מפעלי מים וביוב</title>
<meta name="theme-color" content="#0B4F6C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --primary:#0B4F6C; --primary-600:#0d6188; --primary-100:#dcedf5; --primary-50:#f0f7fa;
  --water:#0284C7; --water-bg:#E0F2FE;
  --sewage:#B45309; --sewage-bg:#FEF3C7;
  --general:#64748B; --general-bg:#F1F5F9;
  --success:#15803D; --success-bg:#DCFCE7;
  --danger:#DC2626; --danger-bg:#FEE2E2;
  --warning:#D97706; --warning-bg:#FEF3C7;
  --transfer:#7C3AED; --transfer-bg:#EDE9FE;
  --bg:#F0F4F8; --surface:#FFFFFF; --border:#DBE4EC;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 3px rgba(11,79,108,.08),0 4px 14px rgba(11,79,108,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Heebo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-600);box-shadow:0 0 0 3px rgba(13,97,136,.12)}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px;color:var(--text-2)}
.field{margin-bottom:14px}
.hint{font-size:12.5px;color:var(--text-3);margin-top:4px}
.req::after{content:" *";color:var(--danger)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;transition:filter .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-water{background:var(--water);color:#fff}
.btn-outline{border:1.5px solid var(--border);background:var(--surface);color:var(--text-2)}
.btn-outline:hover{border-color:var(--primary-600);color:var(--primary-600)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warn{background:var(--warning);color:#fff}
.btn-sm{padding:7px 13px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip-open{background:var(--primary-100);color:var(--primary)}
.chip-progress{background:var(--warning-bg);color:var(--warning)}
.chip-transfer{background:var(--transfer-bg);color:var(--transfer)}
.chip-done{background:var(--success-bg);color:var(--success)}
.chip-water{background:var(--water-bg);color:#075985}
.chip-sewage{background:var(--sewage-bg);color:var(--sewage)}
.chip-general{background:var(--general-bg);color:var(--general)}
.chip-late{background:var(--danger-bg);color:var(--danger)}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:14px}
@media(min-width:720px){.grid-2{grid-template-columns:1fr 1fr}.grid-4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:719px){.grid-4{grid-template-columns:repeat(2,1fr)}}

/* topbar */
.topbar{background:linear-gradient(135deg,var(--primary) 0%,#0d6188 70%,#0f7ba8 100%);color:#fff;position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:18px}
.topbar .spacer{flex:1}
.topbar .who{font-size:13px;opacity:.9;text-align:left}
.topbar button{color:#fff;opacity:.85;padding:8px}
.topbar button:hover{opacity:1}

/* tabs nav */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:40;overflow-x:auto}
.nav .wrap{display:flex;gap:4px;padding:0 8px}
.nav button{padding:13px 15px;font-weight:600;color:var(--text-2);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:14px}
.nav button.on{color:var(--primary);border-bottom-color:var(--primary)}

main{padding:20px 0 90px}

/* stat cards */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.stat:hover{transform:translateY(-2px)}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{font-size:13px;color:var(--text-2);font-weight:600;margin-top:3px}
.stat .bar{height:4px;border-radius:3px;margin-top:10px}

/* ticket rows */
.trow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.trow:hover{transform:translateY(-1px)}
.trow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tnum{font-weight:800;font-size:15px;letter-spacing:.5px;color:var(--primary)}
.trow .desc{color:var(--text-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--text-3)}

/* auth screens */
.auth-hero{min-height:100dvh;display:flex;flex-direction:column;background:
  radial-gradient(1200px 500px at 80% -10%,rgba(2,132,199,.25),transparent),
  linear-gradient(160deg,#083548 0%,var(--primary) 45%,#0d6188 100%)}
.auth-hero .inner{flex:1;display:grid;place-items:center;padding:30px 16px}
.auth-card{background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:30px 26px;width:100%;max-width:420px}
.auth-card h1{font-size:21px;margin-bottom:4px}
.auth-card .sub{color:var(--text-2);font-size:13.5px;margin-bottom:20px}
.landing-top{color:#fff;text-align:center;padding:52px 16px 8px}
.landing-top .badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:5px 16px;border-radius:99px;font-size:13px;margin-bottom:18px}
.landing-top h1{font-size:clamp(26px,5vw,40px);font-weight:800;line-height:1.25}
.landing-top p{opacity:.85;max-width:560px;margin:14px auto 0;font-size:15.5px}
.landing-feats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:900px;margin:34px auto;padding:0 16px}
.feat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:16px;color:#fff;font-size:13.5px}
.feat b{display:block;font-size:14.5px;margin-bottom:4px}
.landing-cta{display:flex;gap:12px;justify-content:center;padding:6px 16px 56px;flex-wrap:wrap}
.pw-wrap{position:relative}
.pw-wrap input{padding-left:44px}
.pw-eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);padding:7px;color:var(--text-3);font-size:17px}
.pw-rules{font-size:12px;margin-top:6px}
.pw-rules span{display:inline-block;margin-inline-end:12px;color:var(--text-3)}
.pw-rules span.ok{color:var(--success);font-weight:600}
.alert{padding:11px 14px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:14px}
.alert-err{background:var(--danger-bg);color:var(--danger)}
.alert-ok{background:var(--success-bg);color:var(--success)}
.alert-info{background:var(--primary-100);color:var(--primary)}
.link{color:var(--primary-600);font-weight:600;text-decoration:none;font-size:13.5px}
.link:hover{text-decoration:underline}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,30,42,.55);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:22px}
.modal h2{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal .x{color:var(--text-3);font-size:22px;padding:2px 8px}

/* detail page */
.detail-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px}
.kv dt{color:var(--text-3);font-weight:600;white-space:nowrap}
.kv dd{color:var(--text)}
.section-t{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.timeline{list-style:none}
.timeline li{position:relative;padding:0 22px 16px 0;border-right:2px solid var(--border)}
.timeline li::before{content:"";position:absolute;right:-6.5px;top:4px;width:11px;height:11px;border-radius:99px;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border)}
.timeline .t{font-size:12px;color:var(--text-3)}
.timer-big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sla-ok{color:var(--success)}.sla-late{color:var(--danger)}

/* fab actions */
.fab-row{position:fixed;bottom:16px;inset-inline:0;display:flex;gap:10px;justify-content:center;z-index:60;padding:0 16px;pointer-events:none}
.fab-row .btn{pointer-events:auto;box-shadow:0 8px 24px rgba(11,79,108,.35);border-radius:99px}

/* tables */
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}
table.rep th{text-align:right;color:var(--text-3);font-weight:600;padding:8px;border-bottom:1.5px solid var(--border)}
table.rep td{padding:9px 8px;border-bottom:1px solid var(--border)}
.pbar{background:var(--general-bg);border-radius:99px;height:9px;overflow:hidden}
.pbar>div{height:100%;border-radius:99px;background:var(--primary-600)}

.empty{text-align:center;color:var(--text-3);padding:44px 16px;font-size:14px}
.empty .i{font-size:38px;margin-bottom:10px}
#toast{position:fixed;bottom:80px;inset-inline:0;display:flex;justify-content:center;z-index:200;pointer-events:none}
#toast>div{background:var(--text);color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.map-box{height:340px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;z-index:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:130px;padding:8px 11px;font-size:13.5px}
@media(max-width:600px){.filters select,.filters input{flex:1;min-width:110px}}
.leaflet-container{font-family:'Heebo',sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden><div></div></div>
<script>
/* ================= ניהול אנשי שטח — הרי נצרת מפעלי מים וביוב ================= */
'use strict';

/* ---------- אחסון בטוח (localStorage עם נפילה לזיכרון) ---------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
const DB_KEY='hari_field_v1';

function loadDB(){
  try{ const raw=store.get(DB_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveDB(){ store.set(DB_KEY, JSON.stringify(DB)); }

/* ---------- סכימה ראשונית + משתמש מנהל-על ---------- */
let DB = loadDB() || {
  users:[{
    id:'u_super', name:'תומר עוז', email:'tomer@hari-nazareth.org.il', phone:'',
    role:'super', pass:'Tomer1234', createdAt:Date.now(), device:null
  }],
  tickets:[], counters:{}, resets:{}
};

/* ---------- קבועים ---------- */
const CITIES=['נצרת','ריינה','יפיע','איכסל','עילוט'];
const ROLES={super:'מנהל על', manager:'מנהלן', field:'איש שטח'};
const DOMAINS={W:{name:'מים',chip:'chip-water'}, S:{name:'ביוב',chip:'chip-sewage'}, G:{name:'כללי',chip:'chip-general'}};
const TYPES={
  W:['נזילה / פיצוץ מים','החלפת מונה שבור','התקנת חיבור חדש למגרש','התקנת מונה','החלפת מונה','תלונה על איכות מים','הפסקת מים','אחר'],
  S:['גלישת ביוב','שבר בשוחה / במכסה שוחה','תלונה על ריח','בקשה להכנת חיבור מגרש','אחר'],
  G:['אי החזרת המצב לקדמותו']
};
/* טבלת SLA — שעות יעד לפי סוג פניה (מנהל יכול לשנות בדף הפניה) */
const SLA={
  'נזילה / פיצוץ מים':4,'גלישת ביוב':4,'הפסקת מים':4,
  'תלונה על איכות מים':24,'שבר בשוחה / במכסה שוחה':24,
  'תלונה על ריח':48,'החלפת מונה שבור':48,
  'התקנת מונה':72,'החלפת מונה':72,'אחר':72,
  'אי החזרת המצב לקדמותו':96,
  'התקנת חיבור חדש למגרש':168,'בקשה להכנת חיבור מגרש':168
};
const STATUSES={open:'פתוחה',progress:'בטיפול',done:'הושלמה'};
const STATUS_CHIP={open:'chip-open',progress:'chip-progress',done:'chip-done'};

/* ---------- עזרים ---------- */
const $=s=>document.querySelector(s);
const uid=()=>'u_'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT=t=>t?new Date(t).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fmtD=t=>t?new Date(t).toLocaleDateString('he-IL'):'—';
function fmtDur(ms){
  if(ms<0) ms=0;
  const m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  if(d>0) return `${d} ימ׳ ${h} שע׳`;
  if(h>0) return `${h}:${String(mm).padStart(2,'0')} שע׳`;
  return `${mm} דק׳`;
}
function toast(msg){
  const t=$('#toast'); t.firstElementChild.textContent=msg; t.hidden=false;
  clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,2600);
}
const userById=id=>DB.users.find(u=>u.id===id);
const userName=id=>userById(id)?.name||'—';

/* ---------- מספור פניות אוטומטי: W/S/G + שנה(2) + חודש(2) + 4 ספרות רץ ---------- */
function nextTicketNumber(domain){
  const d=new Date(), yy=String(d.getFullYear()).slice(2), mm=String(d.getMonth()+1).padStart(2,'0');
  const key=domain+yy+mm;
  DB.counters[key]=(DB.counters[key]||0)+1;
  return key+String(DB.counters[key]).padStart(4,'0');
}

/* ---------- סשן ---------- */
const SES_KEY='hari_field_session';
function currentUser(){
  const id=store.get(SES_KEY);
  return id?userById(id):null;
}
function login(u){ store.set(SES_KEY,u.id); route('home'); }
function logout(){ store.del(SES_KEY); route('landing'); }

/* ---------- סיסמה: 8 תווים לפחות, חובה אותיות באנגלית ומספרים ---------- */
function passChecks(p){
  return { len:p.length>=8, eng:/[A-Za-z]/.test(p), num:/[0-9]/.test(p) };
}
const passOK=p=>{const c=passChecks(p);return c.len&&c.eng&&c.num;};

/* ================= ניתוב ================= */
let VIEW={name:'landing',arg:null};
function route(name,arg){ VIEW={name,arg}; render(); window.scrollTo(0,0); }

function render(){
  const u=currentUser();
  if(!u && !['landing','login','register','forgot','reset'].includes(VIEW.name)) VIEW={name:'landing'};
  if(u && ['landing','login','register','forgot','reset'].includes(VIEW.name)) VIEW={name:'home'};
  const app=$('#app');
  switch(VIEW.name){
    case 'landing': app.innerHTML=vLanding(); break;
    case 'login': app.innerHTML=vLogin(); break;
    case 'register': app.innerHTML=vRegister(); break;
    case 'forgot': app.innerHTML=vForgot(); break;
    case 'reset': app.innerHTML=vReset(); break;
    default: app.innerHTML=vShell(u); renderInner(u);
  }
  bindPwEyes();
}

/* ================= דף נחיתה ציבורי ================= */
function vLanding(){
  return `<div class="auth-hero">
    <div class="landing-top">
      <div class="badge">הרי נצרת מפעלי מים וביוב בע"מ</div>
      <h1>שליטה מלאה על עבודת השטח,<br>מהפנייה ועד הדוח</h1>
      <p>ניהול פקודות עבודה, תיעוד ביצוע בשטח עם תמונות ומיקום, מעקב זמני טיפול ובקרה ניהולית בזמן אמת — מים, ביוב וכללי.</p>
    </div>
    <div class="landing-feats">
      <div class="feat"><b>📋 פקודות עבודה</b>פתיחה, שיוך והעברה בין גורמים עם מספר פניה קבוע והיסטוריה מלאה.</div>
      <div class="feat"><b>📸 תיעוד בשטח</b>צילום לפני/אחרי ישירות מהמצלמה, נ.צ GPS ותיאור ביצוע.</div>
      <div class="feat"><b>⏱️ זמני טיפול (SLA)</b>יעד אוטומטי לפי סוג הפניה ומדידת זמן חיה עד להשלמה.</div>
      <div class="feat"><b>📊 בקרה ניהולית</b>לוח בקרה למנהל: עומסים, עמידה ביעדים, פניות פתוחות והעברות.</div>
    </div>
    <div class="landing-cta">
      <button class="btn btn-water" style="padding:13px 34px" onclick="route('login')">התחברות</button>
      <button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:13px 34px" onclick="route('register')">הרשמה</button>
    </div>
  </div>`;
}

/* ================= התחברות ================= */
function pwField(id,label='סיסמה',auto='current-password'){
  return `<div class="field"><label class="req" for="${id}">${label}</label>
    <div class="pw-wrap">
      <input type="password" id="${id}" autocomplete="${auto}" dir="ltr" style="text-align:left">
      <button type="button" class="pw-eye" data-eye="${id}" title="הצגת סיסמה">👁</button>
    </div>
    <div class="pw-rules" data-rules="${id}" hidden>
      <span data-r="len">8 תווים לפחות</span><span data-r="eng">אותיות באנגלית</span><span data-r="num">מספרים</span>
    </div></div>`;
}
function bindPwEyes(){
  document.querySelectorAll('.pw-eye').forEach(b=>{
    b.onclick=()=>{ const i=$('#'+b.dataset.eye); i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'👁':'🙈'; };
  });
  document.querySelectorAll('[data-rules]').forEach(r=>{
    const inp=$('#'+r.dataset.rules); r.hidden=false;
    inp.addEventListener('input',()=>{
      const c=passChecks(inp.value);
      r.querySelectorAll('[data-r]').forEach(s=>s.classList.toggle('ok',c[s.dataset.r]));
    });
  });
}

function vLogin(){

/* ---------- לוגיקת פניות ---------- */
function myTickets(u){ return DB.tickets.filter(t=>t.assignedTo===u.id); }
function isToday(t){ const d=new Date(t),n=new Date(); return d.toDateString()===n.toDateString(); }
function ticketById(id){ return DB.tickets.find(t=>t.id===id); }
function canEdit(u,t){ return u.role==='super' || t.assignedTo===u.id; }
function slaState(t){
  if(t.status==='done') return t.completedAt<=t.dueAt?'ok':'late';
  return Date.now()<=t.dueAt?'ok':'late';
}

function createTicket(u,data){
  const number=nextTicketNumber(data.domain);
  const sla=data.slaHours ?? (SLA[data.type]||72);
  const now=Date.now();
  const t={
    id:'t_'+Math.random().toString(36).slice(2,10), number,
    domain:data.domain, type:data.type, city:data.city, address:data.address||'',
    customerName:data.customerName||'', customerId:data.customerId||'', customerPhone:data.customerPhone||'',
    description:data.description||'', status:'open',
    createdAt:now, createdBy:u.id, assignedTo:data.assignedTo,
    slaHours:sla, dueAt:now+sla*3600000,
    firstResponseAt:null, responseResetAt:null,
    history:[{at:now,by:u.id,action:'פתיחת פניה',note:'שויכה ל'+userName(data.assignedTo)}],
    photosBefore:[], photosAfter:[], workLog:'', gps:null, completedAt:null,
    foundByField:!!data.foundByField, outage:data.outage||null
  };
  DB.tickets.unshift(t); saveDB();
  return t;
}
function addHistory(t,u,action,note){ t.history.push({at:Date.now(),by:u.id,action,note:note||''}); }

function setStatus(id,status){
  const u=currentUser(), t=ticketById(id);
  if(!canEdit(u,t)){ toast('רק הגורם המטפל יכול לעדכן פניה זו'); return; }
  if(status==='done' && t.photosAfter.length===0){ toast('⚠️ לא ניתן לסמן "הושלמה" ללא תמונת "אחרי"'); return; }
  if(t.status==='open' && status!=='open' && !t.firstResponseAt) t.firstResponseAt=Date.now();
  t.status=status;
  if(status==='done'){ t.completedAt=Date.now(); t.workLog=$('#wlog')?.value??t.workLog; }
  addHistory(t,u,'שינוי סטטוס: '+STATUSES[status]);
  saveDB(); render(); toast('הסטטוס עודכן: '+STATUSES[status]);
}

/* אסקלציה — העברת פניה לגורם אחר; המספר נשמר, response_reset_at מתאפס */
function transferTicket(id,toId){
  const u=currentUser(), t=ticketById(id), to=userById(toId);
  if(!canEdit(u,t)){ toast('רק הגורם המטפל יכול להעביר פניה זו'); return; }
  const from=t.assignedTo;
  t.assignedTo=toId;
  t.responseResetAt=Date.now();
  if(!t.firstResponseAt) t.firstResponseAt=Date.now();
  if(t.status==='done'){} else t.status='open';
  addHistory(t,u,'העברת פניה (אסקלציה)','מ'+userName(from)+' אל '+to.name);
  saveDB(); closeModal(); render(); toast('הפניה הועברה אל '+to.name);
}

/* ---------- מסך ראשי ---------- */
function vHome(u){
  const mine=myTickets(u);
  const open=mine.filter(t=>t.status==='open');
  const prog=mine.filter(t=>t.status==='progress');
  const moved=DB.tickets.filter(t=>t.status!=='done' && t.assignedTo!==u.id && t.history.some(h=>h.by===u.id&&h.action.startsWith('העברת פניה')));
  const doneToday=DB.tickets.filter(t=>t.status==='done'&&t.completedAt&&isToday(t.completedAt)&&t.history.some(h=>h.by===u.id));
  const active=[...open,...prog].sort((a,b)=>a.dueAt-b.dueAt);
  return `
  <div class="grid grid-4" style="margin-bottom:20px">
    ${statCard(open.length,'פניות לטיפולי','var(--primary)','tickets','open')}
    ${statCard(prog.length,'בביצוע','var(--warning)','tickets','progress')}
    ${statCard(moved.length,'פניות שהעברתי','var(--transfer)','tickets','moved')}
    ${statCard(doneToday.length,'הושלמו היום','var(--success)','tickets','doneToday')}
  </div>
  ${u.role==='field'?`
  <div class="grid grid-2" style="margin-bottom:20px">
    <button class="btn btn-water" style="padding:16px" onclick="openFoundFault()">🛠️ מצאתי תקלה — דיווח מהשטח</button>
    <button class="btn btn-danger" style="padding:16px" onclick="openOutage()">🚱 דיווח הפסקת מים</button>
  </div>`:`
  <div class="grid grid-2" style="margin-bottom:20px">
    <button class="btn btn-primary" style="padding:16px" onclick="route('newTicket')">➕ פתיחת פניה חדשה</button>
    <button class="btn btn-outline" style="padding:16px" onclick="openFoundFault()">🛠️ מצאתי תקלה</button>
  </div>`}
  <div class="section-t">המשימות שלי — לפי דחיפות</div>
  ${active.length?active.map(trow).join(''):'<div class="empty"><div class="i">🎉</div>אין פניות פתוחות לטיפולך כרגע.</div>'}`;
}
function statCard(n,l,color,view,filter){
  return `<div class="stat" onclick="route('${view}','${filter}')">
    <div class="n" style="color:${color}">${n}</div><div class="l">${l}</div>
    <div class="bar" style="background:${color};opacity:.25"></div></div>`;
}

/* ---------- שורת פניה ---------- */
function trow(t){
  const d=DOMAINS[t.domain], late=slaState(t)==='late';
  return `<div class="trow" onclick="route('ticket','${t.id}')">
    <div class="top">
      <span class="tnum" dir="ltr">${t.number}</span>
      <span class="chip ${d.chip}">${d.name}</span>
      <span class="chip ${STATUS_CHIP[t.status]}">${STATUSES[t.status]}</span>
      ${late&&t.status!=='done'?'<span class="chip chip-late">⏰ חריגה מיעד</span>':''}
      ${t.outage?'<span class="chip chip-late">🚱 הפסקת מים</span>':''}

    <div style="font-weight:700;font-size:14.5px;margin-bottom:3px">${esc(t.type)} · ${esc(t.city)}</div>
    <div class="desc">${esc(t.description)||'ללא תיאור'}</div>
    <div class="meta">
      <span>👤 ${esc(userName(t.assignedTo))}</span>
      <span>📅 ${fmtDT(t.createdAt)}</span>
      <span>🎯 יעד: ${fmtDT(t.dueAt)}</span>
      ${t.status!=='done'?`<span data-live="${t.id}">⏱ ${fmtDur(Date.now()-t.createdAt)}</span>`:`<span>✅ ${fmtDur((t.completedAt||0)-t.createdAt)}</span>`}
    </div>
  </div>`;
}

/* ---------- רשימת פניות + סינון ---------- */
function vTickets(u){
  const f=VIEW.arg;
  let list=[...DB.tickets];
  if(u.role==='field') list=list.filter(t=>t.assignedTo===u.id||t.history.some(h=>h.by===u.id));
  if(f==='open') list=list.filter(t=>t.status==='open'&&t.assignedTo===u.id);
  if(f==='progress') list=list.filter(t=>t.status==='progress'&&t.assignedTo===u.id);
  if(f==='moved') list=list.filter(t=>t.status!=='done'&&t.assignedTo!==u.id&&t.history.some(h=>h.by===u.id&&h.action.startsWith('העברת פניה')));
  if(f==='doneToday') list=list.filter(t=>t.status==='done'&&isToday(t.completedAt||0));
  return `
  <div class="filters">
    <input id="f_q" placeholder="🔍 חיפוש מס׳ פניה / כתובת / לקוח" oninput="applyFilters()">
    <select id="f_domain" onchange="applyFilters()"><option value="">כל הסיווגים</option><option value="W">מים</option><option value="S">ביוב</option><option value="G">כללי</option></select>
    <select id="f_status" onchange="applyFilters()"><option value="">כל הסטטוסים</option><option value="open">פתוחה</option><option value="progress">בטיפול</option><option value="done">הושלמה</option></select>
    <select id="f_city" onchange="applyFilters()"><option value="">כל הישובים</option>${CITIES.map(c=>`<option>${c}</option>`).join('')}</select>
  </div>
  <div id="tlist">${list.length?list.map(trow).join(''):'<div class="empty"><div class="i">📭</div>לא נמצאו פניות.</div>'}</div>`;
}
function applyFilters(){
  const u=currentUser();
  const q=$('#f_q').value.trim().toLowerCase(), dm=$('#f_domain').value, st=$('#f_status').value, ct=$('#f_city').value;
  let list=[...DB.tickets];
  if(u.role==='field') list=list.filter(t=>t.assignedTo===u.id||t.history.some(h=>h.by===u.id));
  if(dm) list=list.filter(t=>t.domain===dm);
  if(st) list=list.filter(t=>t.status===st);
  if(ct) list=list.filter(t=>t.city===ct);
  if(q) list=list.filter(t=>[t.number,t.address,t.customerName,t.customerPhone,t.description,t.type].join(' ').toLowerCase().includes(q));
  $('#tlist').innerHTML=list.length?list.map(trow).join(''):'<div class="empty"><div class="i">📭</div>לא נמצאו פניות.</div>';
}

function compressImages(files,done){
  const out=[]; let left=files.length;
  if(!left){ done(out); return; }
  files.forEach(f=>{
    const img=new Image(), rd=new FileReader();
    rd.onload=()=>{ img.onload=()=>{
      const c=document.createElement('canvas'), max=1024;
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      out.push(c.toDataURL('image/jpeg',.72));
      if(--left===0) done(out);
    }; img.src=rd.result; };
    rd.readAsDataURL(f);
  });
}
function addPhoto(ev,id,kind){
  const t=ticketById(id), files=[...ev.target.files];
  if(!files.length) return;
  compressImages(files,list=>{
    t[kind].push(...list);
    addHistory(t,currentUser(),'העלאת תמונות '+(kind==='photosBefore'?'לפני':'אחרי'),list.length+' תמונות');
    try{ saveDB(); }catch(e){ toast('שים לב: נפח האחסון המקומי מלא'); }

/* ---------- מפות (Leaflet + OpenStreetMap) ---------- */
function initTicketMap(id){
  const t=ticketById(id);
  if(!t||!t.gps||!window.L||!$('#tmap')) return;
  try{
    const m=L.map('tmap').setView([t.gps.lat,t.gps.lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
    L.marker([t.gps.lat,t.gps.lng]).addTo(m).bindPopup(t.number);
  }catch(e){}
}
function initBigMap(){
  if(!window.L||!$('#bigmap')) return;
  try{
    const m=L.map('bigmap').setView([32.702,35.297],12); /* אזור נצרת */
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
    const pts=DB.tickets.filter(t=>t.gps&&t.status!=='done');
    pts.forEach(t=>{
      L.marker([t.gps.lat,t.gps.lng]).addTo(m)
        .bindPopup(`<b dir="ltr">${t.number}</b><br>${esc(t.type)} · ${esc(t.city)}<br><a href="javascript:route('ticket','${t.id}')">פתיחת כרטיס ←</a>`);
    });

  }catch(e){}
}

    ${statCard(lateOpen.length,'חריגות מיעד','var(--danger)','tickets','')}
    ${statCard(transferred.length,'פניות שהועברו','var(--transfer)','tickets','')}
    <div class="stat"><div class="n" style="color:var(--success)">${slaPct===null?'—':slaPct+'%'}</div><div class="l">עמידה בזמני טיפול</div><div class="bar" style="background:var(--success);opacity:.25"></div></div>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <div class="section-t">👥 פניות פתוחות לכל עובד</div>
      ${byWorker.length?byWorker.map(x=>`
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
            <b>${esc(x.w.name)}</b><span>${x.n} פניות</span></div>
          <div class="pbar"><div style="width:${x.n/maxN*100}%"></div></div>
        </div>`).join(''):'<div class="hint">אין פניות פתוחות.</div>'}
    </div>
    <div class="card">
      <div class="section-t">⏰ חריגות מיעד טיפול</div>
      ${lateOpen.length?lateOpen.slice(0,8).map(t=>`
        <div class="trow" style="box-shadow:none;margin-bottom:8px" onclick="route('ticket','${t.id}')">
          <div class="top"><span class="tnum" dir="ltr">${t.number}</span><span class="chip chip-late">איחור ${fmtDur(Date.now()-t.dueAt)}</span></div>
          <div style="font-size:13px">${esc(t.type)} · ${esc(t.city)} · ${esc(userName(t.assignedTo))}</div>
        </div>`).join(''):'<div class="hint">אין חריגות — כל הפניות בתוך היעד. 👏</div>'}
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="section-t">↪ פניות שעברו לטיפול גורם אחר (פתוחות)</div>
    ${transferred.length?`<table class="rep"><tr><th>מס׳ פניה</th><th>סוג</th><th>גורם נוכחי</th><th>הועברה</th><th>סטטוס</th></tr>
      ${transferred.map(t=>`<tr style="cursor:pointer" onclick="route('ticket','${t.id}')">
        <td class="tnum" dir="ltr">${t.number}</td><td>${esc(t.type)}</td><td>${esc(userName(t.assignedTo))}</td>
        <td>${fmtDT(t.responseResetAt)}</td><td><span class="chip ${STATUS_CHIP[t.status]}">${STATUSES[t.status]}</span></td></tr>`).join('')}</table>`
      :'<div class="hint">אין פניות שהועברו.</div>'}
  </div>`;
}

/* ---------- דוחות ---------- */
function vReports(u){
  const T=DB.tickets;
  const byStatus=['open','progress','done'].map(s=>({s,n:T.filter(t=>t.status===s).length}));
  const byDomain=Object.keys(DOMAINS).map(d=>({d,n:T.filter(t=>t.domain===d).length}));
  const byCity=CITIES.map(c=>({c,n:T.filter(t=>t.city===c).length})).filter(x=>x.n>0);
  const done=T.filter(t=>t.status==='done');
  const avgMs=done.length?done.reduce((a,t)=>a+(t.completedAt-t.createdAt),0)/done.length:0;
  /* תפוקת אנשי שטח: פניות שהושלמו לפי גורם מטפל */
  const output=DB.users.map(w=>{
    const mine=done.filter(t=>t.assignedTo===w.id);
    const inSLA=mine.filter(t=>t.completedAt<=t.dueAt).length;
    const avg=mine.length?mine.reduce((a,t)=>a+(t.completedAt-t.createdAt),0)/mine.length:0;
    return {w,total:mine.length,inSLA,avg};
  }).filter(x=>x.total>0);
  const byType={};
  T.forEach(t=>byType[t.type]=(byType[t.type]||0)+1);
  return `
  <div class="grid grid-2" style="margin-bottom:14px">
    <div class="card"><div class="section-t">📦 פקודות עבודה לפי סטטוס</div>
      <table class="rep">${byStatus.map(x=>`<tr><td>${STATUSES[x.s]}</td><td><b>${x.n}</b></td></tr>`).join('')}
      <tr><td><b>סה"כ</b></td><td><b>${T.length}</b></td></tr></table></div>
    <div class="card"><div class="section-t">🧭 חתכים</div>
      <table class="rep">
        ${byDomain.map(x=>`<tr><td>סיווג ${DOMAINS[x.d].name}</td><td><b>${x.n}</b></td></tr>`).join('')}
        ${byCity.map(x=>`<tr><td>ישוב ${x.c}</td><td><b>${x.n}</b></td></tr>`).join('')}
        <tr><td>זמן טיפול ממוצע (פניות שהושלמו)</td><td><b>${done.length?fmtDur(avgMs):'—'}</b></td></tr>
      </table></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="section-t">🏗 תפוקת אנשי שטח</div>
    ${output.length?`<table class="rep"><tr><th>עובד</th><th>הושלמו</th><th>בתוך היעד</th><th>זמן ממוצע</th><th>נצילות (עמידה ביעד)</th></tr>
      ${output.map(x=>`<tr><td><b>${esc(x.w.name)}</b></td><td>${x.total}</td><td>${x.inSLA}</td><td>${fmtDur(x.avg)}</td>
        <td><div class="pbar" style="min-width:90px"><div style="width:${Math.round(x.inSLA/x.total*100)}%;background:var(--success)"></div></div> ${Math.round(x.inSLA/x.total*100)}%</td></tr>`).join('')}</table>`
      :'<div class="hint">אין עדיין פניות שהושלמו.</div>'}
  </div>
  <div class="card">
    <div class="section-t">🔠 כמות פניות לפי סוג</div>
    <table class="rep">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${v}</b></td></tr>`).join('')||'<tr><td class="hint">אין נתונים</td></tr>'}</table>
  </div>`;
}

/* ---------- ניהול משתמשים (מנהל על בלבד) ---------- */
function vUsers(u){
  if(u.role!=='super') return '<div class="empty">אין לך הרשאה לצפייה בעמוד זה.</div>';
  return `<div class="card">
    <div class="section-t" style="justify-content:space-between">👥 ניהול משתמשים והרשאות
      <button class="btn btn-primary btn-sm" onclick="openAddUser()">➕ הוספת משתמש</button></div>
    <div class="alert alert-info">כל נרשם חדש מוגדר תחילה כ<b>איש שטח</b>. כאן ניתן להוסיף משתמשים ביוזמתך, לשדרג הרשאות ולאפס סיסמאות.</div>
    <table class="rep"><tr><th>שם</th><th>דוא"ל</th><th>טלפון</th><th>הרשאה</th><th></th></tr>
    ${DB.users.map(w=>`<tr>
      <td><b>${esc(w.name)}</b></td>
      <td dir="ltr" style="text-align:right">${esc(w.email)}</td>
      <td dir="ltr" style="text-align:right">${esc(w.phone||'—')}</td>
      <td>${w.id===u.id?ROLES[w.role]+' (אתה)':`<select style="width:auto;padding:6px 10px;font-size:13px" onchange="setRole('${w.id}',this.value)">
        ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${w.role===k?'selected':''}>${v}</option>`).join('')}</select>`}</td>
      <td>${w.id!==u.id?`<button class="btn btn-outline btn-sm" onclick="resetUserPass('${w.id}')">איפוס סיסמה</button>`:''}</td>
    </tr>`).join('')}</table>
  </div>`;
}
function openAddUser(){
  showModal(`<h2>➕ הוספת משתמש חדש <button class="x" onclick="closeModal()">×</button></h2>
    <div id="msg"></div>
    <div class="field"><label class="req" for="au_name">שם מלא</label><input id="au_name"></div>
    <div class="field"><label class="req" for="au_email">דוא"ל</label><input type="email" id="au_email" dir="ltr" style="text-align:left"></div>
    <div class="field"><label for="au_phone">טלפון</label><input type="tel" id="au_phone" dir="ltr" style="text-align:left"></div>
    <div class="field"><label class="req">רמת הרשאה</label>
      <select id="au_role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k==='field'?'selected':''}>${v}</option>`).join('')}</select></div>
    ${pwField('au_pass','סיסמה ראשונית','new-password')}
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn btn-outline btn-sm" onclick="genAuPass()">🎲 הגרלת סיסמה ראשונית</button>
    </div>
    <button class="btn btn-primary btn-block" onclick="doAddUser()">יצירת משתמש</button>
    <div class="hint" style="margin-top:8px">מסרו לעובד את הדוא"ל והסיסמה הראשונית; מומלץ שיחליף אותה דרך "שכחתי סיסמה".</div>`);
}
function genAuPass(){
  const p='Aa'+Math.floor(100000+Math.random()*900000);
  const inp=$('#au_pass'); inp.value=p; inp.type='text';
  inp.dispatchEvent(new Event('input'));
  const eye=document.querySelector('[data-eye="au_pass"]'); if(eye) eye.textContent='🙈';
}
function doAddUser(){
  const name=$('#au_name').value.trim(), email=$('#au_email').value.trim().toLowerCase(),
        phone=$('#au_phone').value.trim(), role=$('#au_role').value, pass=$('#au_pass').value, m=$('#msg');
  if(!name||!email){ m.innerHTML='<div class="alert alert-err">יש למלא שם ודוא"ל.</div>'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ m.innerHTML='<div class="alert alert-err">כתובת דוא"ל לא תקינה.</div>'; return; }
  if(DB.users.some(u=>u.email.toLowerCase()===email)){ m.innerHTML='<div class="alert alert-err">דוא"ל זה כבר רשום במערכת.</div>'; return; }
  if(!passOK(pass)){ m.innerHTML='<div class="alert alert-err">סיסמה: 8 תווים לפחות, חובה אותיות באנגלית ומספרים.</div>'; return; }
  DB.users.push({id:uid(),name,email,phone,role,pass,createdAt:Date.now(),addedBy:currentUser().id});
  saveDB(); closeModal(); render(); toast('המשתמש '+name+' נוסף בהצלחה ('+ROLES[role]+')');
}
function setRole(id,role){
  const w=userById(id); w.role=role; saveDB(); toast(w.name+' עודכן ל'+ROLES[role]); render();
}
function resetUserPass(id){
  const w=userById(id);
  const tmp='Aa'+Math.floor(100000+Math.random()*900000);
  w.pass=tmp; saveDB();
  showModal(`<h2>איפוס סיסמה <button class="x" onclick="closeModal()">×</button></h2>
    <div class="alert alert-ok">הסיסמה של <b>${esc(w.name)}</b> אופסה. סיסמה זמנית:</div>
    <div style="text-align:center;font-size:24px;font-weight:800;letter-spacing:2px" dir="ltr">${tmp}</div>
    <div class="hint" style="text-align:center;margin-top:8px">יש למסור לעובד ולהנחות אותו להחליף דרך "שכחתי סיסמה".</div>`);
}

/* ================= אתחול ================= */
saveDB();
render();
</script>
</body>
</html>
