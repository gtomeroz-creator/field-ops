<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול פניות ומשימות — תאגיד הרי נצרת</title>
<meta name="theme-color" content="#0B4F6C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --primary:#0B4F6C; --primary-600:#0d6188; --primary-100:#dcedf5; --primary-50:#f0f7fa;
  --water:#0284C7; --water-bg:#E0F2FE;
  --sewage:#B45309; --sewage-bg:#FEF3C7;
  --general:#64748B; --general-bg:#F1F5F9;
  --success:#15803D; --success-bg:#DCFCE7;
  --danger:#DC2626; --danger-bg:#FEE2E2;
  --warning:#D97706; --warning-bg:#FEF3C7;
  --transfer:#7C3AED; --transfer-bg:#EDE9FE;
  --bg:#F0F4F8; --surface:#FFFFFF; --border:#DBE4EC;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 3px rgba(11,79,108,.08),0 4px 14px rgba(11,79,108,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Heebo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-600);box-shadow:0 0 0 3px rgba(13,97,136,.12)}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px;color:var(--text-2)}
.field{margin-bottom:14px}
.hint{font-size:12.5px;color:var(--text-3);margin-top:4px}
.req::after{content:" *";color:var(--danger)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;transition:filter .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-water{background:var(--water);color:#fff}
.btn-outline{border:1.5px solid var(--border);background:var(--surface);color:var(--text-2)}
.btn-outline:hover{border-color:var(--primary-600);color:var(--primary-600)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-warn{background:var(--warning);color:#fff}
.btn-sm{padding:7px 13px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip-open{background:var(--primary-100);color:var(--primary)}
.chip-progress{background:var(--warning-bg);color:var(--warning)}
.chip-transfer{background:var(--transfer-bg);color:var(--transfer)}
.chip-done{background:var(--success-bg);color:var(--success)}
.chip-water{background:var(--water-bg);color:#075985}
.chip-sewage{background:var(--sewage-bg);color:var(--sewage)}
.chip-general{background:var(--general-bg);color:var(--general)}
.chip-late{background:var(--danger-bg);color:var(--danger)}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:14px}
@media(min-width:720px){.grid-2{grid-template-columns:1fr 1fr}.grid-4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:719px){.grid-4{grid-template-columns:repeat(2,1fr)}}

/* topbar */
.topbar{background:linear-gradient(135deg,var(--primary) 0%,#0d6188 70%,#0f7ba8 100%);color:#fff;position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:18px}
.topbar .spacer{flex:1}
.topbar .who{font-size:13px;opacity:.9;text-align:left}
.topbar button{color:#fff;opacity:.85;padding:8px}
.topbar button:hover{opacity:1}

/* tabs nav */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:40;overflow-x:auto}
.nav .wrap{display:flex;gap:4px;padding:0 8px}
.nav button{padding:13px 15px;font-weight:600;color:var(--text-2);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:14px}
.nav button.on{color:var(--primary);border-bottom-color:var(--primary)}

main{padding:20px 0 90px}

/* stat cards */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.stat:hover{transform:translateY(-2px)}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{font-size:13px;color:var(--text-2);font-weight:600;margin-top:3px}
.stat .bar{height:4px;border-radius:3px;margin-top:10px}

/* ticket rows */
.trow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.trow-linked{border-inline-start:4px solid var(--transfer)}
.linked-wrap{border:2px solid var(--transfer);border-radius:14px;padding:8px;margin-bottom:12px;background:#faf7fe}
.linked-cap{font-size:12.5px;font-weight:700;color:var(--transfer);padding:2px 6px 8px}
.linked-wrap .trow-inwrap{margin-bottom:8px;box-shadow:none}
.linked-wrap .trow-inwrap:last-child{margin-bottom:0}
.trow:hover{transform:translateY(-1px)}
.trow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tnum{font-weight:800;font-size:15px;letter-spacing:.5px;color:var(--primary)}
.trow .desc{color:var(--text-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--text-3)}

/* auth screens */
.auth-hero{min-height:100dvh;display:flex;flex-direction:column;background:
  radial-gradient(1200px 500px at 80% -10%,rgba(2,132,199,.25),transparent),
  linear-gradient(160deg,#083548 0%,var(--primary) 45%,#0d6188 100%)}
.auth-hero .inner{flex:1;display:grid;place-items:center;padding:30px 16px}
.auth-card{background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:30px 26px;width:100%;max-width:420px}
.auth-card h1{font-size:21px;margin-bottom:4px}
.auth-card .sub{color:var(--text-2);font-size:13.5px;margin-bottom:20px}
.landing-top{color:#fff;text-align:center;padding:52px 16px 8px}
.landing-top .badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:5px 16px;border-radius:99px;font-size:13px;margin-bottom:18px}
.landing-top h1{font-size:clamp(26px,5vw,40px);font-weight:800;line-height:1.25}
.landing-top p{opacity:.85;max-width:560px;margin:14px auto 0;font-size:15.5px}
.landing-feats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:900px;margin:34px auto;padding:0 16px}
.feat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:16px;color:#fff;font-size:13.5px}
.feat b{display:block;font-size:14.5px;margin-bottom:4px}
.landing-cta{display:flex;gap:12px;justify-content:center;padding:6px 16px 56px;flex-wrap:wrap}
.pw-wrap{position:relative}
.pw-wrap input{padding-left:44px}
.pw-eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);padding:7px;color:var(--text-3);font-size:17px}
.pw-rules{font-size:12px;margin-top:6px}
.pw-rules span{display:inline-block;margin-inline-end:12px;color:var(--text-3)}
.pw-rules span.ok{color:var(--success);font-weight:600}
.alert{padding:11px 14px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:14px}
.alert-err{background:var(--danger-bg);color:var(--danger)}
.alert-ok{background:var(--success-bg);color:var(--success)}
.alert-info{background:var(--primary-100);color:var(--primary)}
.alert-warn{background:#FEF3C7;color:#B45309}
.link{color:var(--primary-600);font-weight:600;text-decoration:none;font-size:13.5px}
.link:hover{text-decoration:underline}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,30,42,.55);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:22px}
.modal h2{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal .x{color:var(--text-3);font-size:22px;padding:2px 8px}

/* detail page */
.detail-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px}
.kv dt{color:var(--text-3);font-weight:600;white-space:nowrap}
.kv dd{color:var(--text)}
.section-t{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.timeline{list-style:none}
.timeline li{position:relative;padding:0 22px 16px 0;border-right:2px solid var(--border)}
.timeline li::before{content:"";position:absolute;right:-6.5px;top:4px;width:11px;height:11px;border-radius:99px;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border)}
.timeline .t{font-size:12px;color:var(--text-3)}
.timer-big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.sla-ok{color:var(--success)}.sla-late{color:var(--danger)}

/* fab actions */
.fab-row{position:fixed;bottom:16px;inset-inline:0;display:flex;gap:10px;justify-content:center;z-index:60;padding:0 16px;pointer-events:none}
.fab-row .btn{pointer-events:auto;box-shadow:0 8px 24px rgba(11,79,108,.35);border-radius:99px}

/* tables */
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}
table.rep th{text-align:right;color:var(--text-3);font-weight:600;padding:8px;border-bottom:1.5px solid var(--border)}
table.rep td{padding:9px 8px;border-bottom:1px solid var(--border)}
.pbar{background:var(--general-bg);border-radius:99px;height:9px;overflow:hidden}
.pbar>div{height:100%;border-radius:99px;background:var(--primary-600)}

.empty{text-align:center;color:var(--text-3);padding:44px 16px;font-size:14px}
.empty .i{font-size:38px;margin-bottom:10px}
#toast{position:fixed;bottom:80px;inset-inline:0;display:flex;justify-content:center;z-index:200;pointer-events:none}
#toast[hidden]{display:none}
#toast>div{background:var(--text);color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.map-box{height:340px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;z-index:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:130px;padding:8px 11px;font-size:13.5px}
@media(max-width:600px){.filters select,.filters input{flex:1;min-width:110px}}
.leaflet-container{font-family:'Heebo',sans-serif}
</style>
</head>

<div id="app"></div>
<div id="toast" hidden><div></div></div>

function usersForTicket(city,type,showAll){
  let list=activeUsers();
  if(showAll) return list;
  const area=TYPE_AREA[type];
  /* הפסקת מים: מוצגים רק מוקדנים ומנהל-על - לא לפי ישוב */
  if(area==='dispatch'){
    return list.filter(u=>u.role==='dispatcher'||u.role==='super');
  }
  if(city) list=list.filter(u=>!(u.cities&&u.cities.length)||u.cities.includes(city));
  if(area) list=list.filter(u=>!(u.workAreas&&u.workAreas.length)||u.workAreas.includes(area));
  return list;
}

async function loadAll(){
  try{
    /* משיכה בעמודים: השרת מחזיר עד 1000 שורות לשאילתה,
       ולכן טבלאות גדולות נמשכות במנות עד שנגמרות. */
    const fetchAll=async(table,orderCol,asc=true)=>{
      const out=[]; const page=1000;
      for(let from=0;;from+=page){
        const {data,error}=await sb.from(table).select('*')
          .order(orderCol,{ascending:asc}).range(from,from+page-1);
        if(error) throw error;
        out.push(...data);
        if(data.length<page) break;
      }
      return out;
    };
    const [pr,tk,hi,ph]=await Promise.all([
      fetchAll('profiles','name'),
      fetchAll('tickets','created_at',false),
      fetchAll('ticket_history','at'),
      fetchAll('ticket_photos','created_at')
    ]).then(a=>a.map(data=>({data,error:null})));
    if(pr.error||tk.error||hi.error||ph.error) throw (pr.error||tk.error||hi.error||ph.error);

    /* קישורים חתומים לתמונות (התוקף שעה; נטען מחדש בכל רענון) */
    const paths=ph.data.map(p=>p.path);
    let urlMap={};
    if(paths.length){
      const {data:signed}=await sb.storage.from('ticket-photos').createSignedUrls(paths,3600);
      (signed||[]).forEach(s=>{ if(s.signedUrl) urlMap[s.path]=s.signedUrl; });
    }

    const histBy={}, photosBy={};
    hi.data.forEach(h=>{ (histBy[h.ticket_id]??=[]).push({at:+new Date(h.at),by:h.by_user,action:h.action,note:h.note||''}); });
    ph.data.forEach(p=>{ const _b=(photosBy[p.ticket_id]??={before:[],after:[],doc:[]}); (_b[p.kind]??=[]).push({id:p.id,path:p.path,url:urlMap[p.path]||'',name:p.file_name||''}); });

    DB.users=pr.data.map(p=>({id:p.id,name:p.name,email:p.email,phone:p.phone||'',role:p.role,active:p.active,cities:p.cities||[],workAreas:p.work_areas||[],createdAt:p.created_at?+new Date(p.created_at):0}));
    DB.tickets=tk.data.map(t=>({
      id:t.id, number:t.number, domain:t.domain, type:t.type, city:t.city, address:t.address||'',
      blockNo:t.block_no||'', parcelNo:t.parcel_no||'',
      form4:t.form4||{},
      customerName:t.customer_name||'', customerId:t.customer_id||'', customerPhone:t.customer_phone||'',
      description:t.description||'', status:t.status,
      createdAt:+new Date(t.created_at), createdBy:t.created_by, assignedTo:t.assigned_to,
      slaHours:+t.sla_hours, dueAt:+new Date(t.due_at),
      firstResponseAt:t.first_response_at?+new Date(t.first_response_at):null,
      responseResetAt:t.response_reset_at?+new Date(t.response_reset_at):null,
      workLog:t.work_log||'',
      breachReason:t.breach_reason||'',
      breachDetail:t.breach_detail||'',
      ongoingAt:t.ongoing_at?+new Date(t.ongoing_at):null,
      ongoingOwner:t.ongoing_owner||null,
      ongoingReason:t.ongoing_reason||'',
      plannedDate:t.planned_date||'',
      gps:t.gps_lat!=null?{lat:t.gps_lat,lng:t.gps_lng,at:t.gps_at?+new Date(t.gps_at):null}:null,
      completedAt:t.completed_at?+new Date(t.completed_at):null,
      foundByField:t.found_by_field, linkedTicketId:t.linked_ticket_id||null,
      outage:t.outage_hours?{area:t.outage_area||'',durationHours:+t.outage_hours}:null,
      history:histBy[t.id]||[],
      photosBefore:(photosBy[t.id]||{}).before||[],
      photosAfter:(photosBy[t.id]||{}).after||[],
      docs:(photosBy[t.id]||{}).doc||[],
      f4photos:Object.fromEntries(Object.keys(F4_PHOTOS).map(k=>[k,(photosBy[t.id]||{})[k]||[]]))
    }));
    OFFLINE=false; LOAD_ERR='';
    try{ checkNewAssignments(); }catch(e){}
    try{ checkClosedTickets(); }catch(e){}
    try{ checkNewUsers(); }catch(e){}
    try{ checkPlannedWorks(); }catch(e){}
    try{ checkEndOfDay(); }catch(e){}
    store.set(CACHE_KEY,JSON.stringify({users:DB.users,tickets:DB.tickets,at:Date.now()}));
  }catch(e){
    /* שמירת הנתונים האחרונים שנשמרו במכשיר */
    const c=store.get(CACHE_KEY);
    if(c){ try{ const j=JSON.parse(c); DB.users=j.users; DB.tickets=j.tickets; }catch(_){} }
    OFFLINE=true;
    /* הבחנה: ניתוק רשת אמיתי מול תקלה בשרת — כדי לא להטעות */
    const netDown=(typeof navigator!=='undefined'&&navigator.onLine===false);
    LOAD_ERR=netDown?'':((e&&e.message)?String(e.message).slice(0,160):'שגיאה לא מזוהה');
  }
}

let _prevMyIds=null; /* null = טעינה ראשונה, אין להתריע */
function checkNewAssignments(){
  if(!ME) return;
  const myIds=new Set(DB.tickets.filter(t=>t.assignedTo===ME.id&&t.status!=='done').map(t=>t.id));
  if(_prevMyIds!==null){
    for(const id of myIds){
      if(!_prevMyIds.has(id)){
        const t=ticketById(id);
        notifyUser('📋 פניה חדשה לטיפולך — '+t.number, t.type+' · '+t.city+(t.address?' · '+t.address:''), id);
      }
    }
  }
  _prevMyIds=myIds;
}

/* התראה לפותח הפניה כשהטיפול בה הסתיים (נסגרה ע"י גורם אחר) */
let _prevOpenedStatus=null;
function checkClosedTickets(){
  if(!ME) return;
  const mineOpened=DB.tickets.filter(t=>t.createdBy===ME.id);
  const cur=new Map(mineOpened.map(t=>[t.id,t.status]));
  if(_prevOpenedStatus!==null){
    for(const [id,st] of cur){
      const prev=_prevOpenedStatus.get(id);
      if(prev&&prev!=='done'&&st==='done'){
        const t=ticketById(id);
        if(t.assignedTo!==ME.id)
          notifyUser('✅ הטיפול בפניה '+t.number+' הסתיים', 'נסגרה ע"י '+userName(t.assignedTo)+' · '+t.type+' · '+t.city, id);
      }
    }
  }
  _prevOpenedStatus=cur;
}
function notifyUser(title,body,ticketId,goto){
  toast(title);
  try{ navigator.vibrate?.([200,100,200]); }catch(e){}
  const N=window.Notification;
  if(N && N.permission==='granted'){
    try{
      const n=new N(title,{body,tag:ticketId?'ticket-'+ticketId:(goto||'hari-eod')});
      n.onclick=()=>{ window.focus(); if(ticketId) route('ticket',ticketId); else if(goto) route(goto); else route('tickets','open'); n.close(); };
    }catch(e){}
  }
}

/* ---------- תזכורת סוף יום: פניות פתוחות שטרם נסגרו ---------- */
let EOD_HOUR=16; /* שעת התזכורת (16:00) */
/* התראה למנהל-על על הצטרפות משתמש חדש (חד-פעמית לכל משתמש) */
let _userBaseline=null;
function checkNewUsers(){
  if(!ME||ME.role!=='super') return;
  const ids=DB.users.map(u=>u.id);
  if(_userBaseline===null){
    /* טעינה ראשונה: מסמנים את כל הקיימים כ"כבר ידועים" בלי להתריע */
    _userBaseline=new Set(ids);
    return;
  }
  for(const w of DB.users){
    if(_userBaseline.has(w.id)) continue;
    _userBaseline.add(w.id);
    const key='hari_newuser_'+w.id;
    if(store.get(key)) continue;          /* כבר דווח בעבר על מכשיר זה */
    store.set(key,'1');
    notifyUser('👤 משתמש חדש נרשם — '+w.name, (isTechEmail(w.email)?'טלפון: '+w.email.replace(TECH_DOMAIN,''):w.email)+' · הוגדר כ'+ROLES[w.role]+'. יש להגדיר תפקיד ושיוך במסך המשתמשים.', null, 'users');
  }
}

/* תזכורת: עבודה מתוכננת שמועדה מתקרב או חלף */
function checkPlannedWorks(){
  if(!ME) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const relevant=DB.tickets.filter(t=>t.status==='ongoing'&&t.plannedDate&&
    (t.assignedTo===ME.id||isMgr(ME)));
  for(const t of relevant){
    const d=new Date(t.plannedDate+'T00:00:00'); d.setHours(0,0,0,0);
    const days=Math.round((d-today)/864e5);
    let kind='';
    if(days===2||days===1) kind='soon';
    else if(days<0) kind='late';
    if(!kind) continue;
    const key='hari_plan_'+kind+'_'+t.id+'_'+ME.id+'_'+today.toDateString();
    if(store.get(key)) continue;
    store.set(key,'1');
    if(kind==='soon')
      notifyUser('🔧 עבודה מתוכננת בעוד '+days+' ימים — '+t.number,
        t.type+' · '+t.city+' · מועד: '+fmtDate(t.plannedDate),t.id);
    else
      notifyUser('⏰ חלף מועד הביצוע — '+t.number,
        t.type+' · '+t.city+' · המועד שנקבע: '+fmtDate(t.plannedDate)+'. יש לעדכן מועד חדש או לסגור.',t.id);
  }
}

function checkEndOfDay(){
  if(!ME) return;
  const now=new Date();
  if(now.getHours()<EOD_HOUR) return;
  const key='hari_eod_'+ME.id+'_'+now.toDateString();
  if(store.get(key)) return;               /* פעם אחת ביום לכל משתמש במכשיר */
  store.set(key,'1');
  const open=DB.tickets.filter(t=>t.assignedTo===ME.id&&t.status!=='done');
  if(!open.length) return;
  const late=open.filter(t=>Date.now()>t.dueAt).length;
  notifyUser(
    '⏰ תזכורת סוף יום — '+open.length+' פניות פתוחות',
    'יש לך '+open.length+' פניות שטרם נסגרו'+(late?', מהן '+late+' בחריגה מיעד':'')+'. לחץ לצפייה והשלמת הטיפול.',
    null
  );
}
function notifState(){
  const N=window.Notification;
  if(!N) return 'unsupported';
  return N.permission; /* granted / denied / default */
}
async function askNotif(){
  const N=window.Notification;
  if(!N){ toast('הדפדפן במכשיר זה אינו תומך בהתראות'); return; }
  const p=await N.requestPermission();
  if(p==='granted'){ toast('התראות הופעלו ✔ תקבל חיווי על פניה חדשה'); }
  else toast('ההתראות לא אושרו — ניתן לאשר דרך הגדרות האתר בדפדפן');
  render();
}

let VIEW={name:'landing',arg:null};
function route(name,arg){
  if(name==='tickets'){

       חזרה מכרטיס פניה או לחיצה על הלשונית = שומרים את הסינון שהיה. */

function render(){

async function doRegister(){

/* ================= אחרי אימות: טעינת פרופיל ונתונים ================= */
async function afterAuth(){
  if(RECOVERY){ route('reset'); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ ME=null; route('landing'); return; }
  /* הפרופיל נוצר ע"י טריגר — ננסה כמה פעמים אם עוד לא הספיק */
  for(let i=0;i<6;i++){
    const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(data){ ME={id:data.id,name:data.name,email:data.email,phone:data.phone||'',role:data.role,active:data.active}; break; }
    await new Promise(r=>setTimeout(r,700));
  }
  if(!ME){ toast('שגיאה בטעינת הפרופיל — נסו לרענן'); return; }
  if(ME.active===false){
    await sb.auth.signOut(); ME=null; route('login');

/* ---------- לוגיקה משותפת ---------- */
function myTickets(u){ return DB.tickets.filter(t=>t.assignedTo===u.id); }
function isToday(t){ const d=new Date(t),n=new Date(); return d.toDateString()===n.toDateString(); }
function ticketById(id){ return DB.tickets.find(t=>t.id===id); }
function canEdit(u,t){ return u.role==='super' || t.assignedTo===u.id; }
const isArchived=t=>t.history&&t.history.some(h=>h.action==='ארכוב קבצים לגיבוי');
function slaState(t){
  if(t.status==='done') return t.completedAt<=t.dueAt?'ok':'late';
  /* בטיפול מתמשך: שעון היעד הדחוף נחתם ברגע הסימון */
  if(t.status==='ongoing') return (t.ongoingAt||Date.now())<=t.dueAt?'ok':'late';
  return Date.now()<=t.dueAt?'ok':'late';
}
/* מועד סיום המדידה של היעד הדחוף (סגירה / סימון מתמשך / כעת) */
const fmtDate=d=>{ if(!d) return '—'; const x=new Date(d+'T12:00:00'); return x.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'}); };
const slaSealedAt=t=>t.status==='done'?t.completedAt:(t.status==='ongoing'?(t.ongoingAt||Date.now()):Date.now());

}

/* ---------- רשימת פניות + סינון וחיפוש ---------- */
/* מסדר פניות מקבילות זו מיד אחרי זו, כדי שיוצגו כזוג */
function groupLinked(list){
  const byId=new Map(list.map(t=>[t.id,t]));
  const out=[], seen=new Set();
  for(const t of list){
    if(seen.has(t.id)) continue;
    out.push(t); seen.add(t.id);
    if(t.linkedTicketId && byId.has(t.linkedTicketId) && !seen.has(t.linkedTicketId)){
      out.push(byId.get(t.linkedTicketId)); seen.add(t.linkedTicketId);
    }
  }
  return out;
}
/* רינדור הרשימה: זוג מקבילות שמופיע ברצף נעטף במסגרת "אירוע משותף" */
function renderList(list){
  if(!list.length) return '<div class="empty"><div class="i">📭</div>לא נמצאו פניות.</div>';
  const byId=new Map(list.map(t=>[t.id,t]));
  let html='', i=0;
  while(i<list.length){
    const t=list[i], next=list[i+1];
    if(next && t.linkedTicketId===next.id && next.linkedTicketId===t.id){
      /* זוג מקבילות עוקבות — עטיפה משותפת */
      html+=`<div class="linked-wrap"><div class="linked-cap">🔗 אירוע משותף — שני גורמים מטפלים</div>${trow(t,true)}${trow(next,true)}</div>`;
      i+=2;
    }else{
      html+=trow(t); i++;
    }
  }
  return html;
}

/* מצב הסינון של דף הפניות — נשמר בין רינדורים (רענון אוטומטי, חזרה מכרטיס) */
let TF={q:'',domain:'',status:'',city:'',assignee:'',from:'',to:'',arg:null};
const ARG_LABELS={open:'פניות לטיפולי',progress:'בביצוע',moved:'פניות שהעברתי ולא נסגרו',doneToday:'הושלמו היום',ongoing:'עבודות בטיפול מתמשך'};

/* רשימת הפניות אחרי סינון המונה (arg) וסינון התיבות — מקור אחד לשתי הדרכים */
function filteredTickets(u){
  let list=visibleTickets(u);
  const f=TF.arg;
  if(f==='open') list=list.filter(t=>t.status==='open'&&t.assignedTo===u.id);
  if(f==='progress') list=list.filter(t=>t.status==='progress'&&t.assignedTo===u.id);
  if(f==='moved') list=list.filter(t=>t.status!=='done'&&t.assignedTo!==u.id&&t.history.some(h=>h.by===u.id&&h.action.startsWith('העברת פניה')));
  if(f==='doneToday') list=list.filter(t=>t.status==='done'&&isToday(t.completedAt||0));
  if(f==='ongoing'){ list=list.filter(t=>t.status==='ongoing'&&(isMgr(u)||t.assignedTo===u.id));
    list.sort((a,b)=>(a.plannedDate||'9999').localeCompare(b.plannedDate||'9999')); }
  if(TF.domain) list=list.filter(t=>t.domain===TF.domain);
  if(TF.status) list=list.filter(t=>t.status===TF.status);
  if(TF.city) list=list.filter(t=>t.city===TF.city);
  if(TF.assignee) list=list.filter(t=>t.assignedTo===TF.assignee);   /* הגורם שהפניה אצלו כעת */
  if(TF.from){ const a=new Date(TF.from+'T00:00:00').getTime(); list=list.filter(t=>t.createdAt>=a); }
  if(TF.to){ const b=new Date(TF.to+'T23:59:59').getTime(); list=list.filter(t=>t.createdAt<=b); }
  if(TF.q){ const q=TF.q; list=list.filter(t=>[t.number,t.address,t.customerName,t.customerPhone,t.description,t.type].join(' ').toLowerCase().includes(q)); }
  return groupLinked(list);
}
function tfActive(){ return !!(TF.q||TF.domain||TF.status||TF.city||TF.assignee||TF.from||TF.to||TF.arg); }
function clearFilters(){ TF={q:'',domain:'',status:'',city:'',assignee:'',from:'',to:'',arg:null}; render(); }
function clearArg(){ TF.arg=null; render(); }
function tfPreset(p){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), fmt=d=>d.toISOString().slice(0,10);
  if(p==='month'){ TF.from=fmt(new Date(y,m,1)); TF.to=fmt(new Date(y,m+1,0)); }
  else if(p==='prev'){ TF.from=fmt(new Date(y,m-1,1)); TF.to=fmt(new Date(y,m,0)); }
  else { TF.from=''; TF.to=''; }
  render();
}

    t.linkedTicketId?(ticketById(t.linkedTicketId)?.number||''):'',
    t.breachReason||'', t.breachDetail||'',
    t.plannedDate?fmtDate(t.plannedDate):'', t.ongoingReason||''
  ]);
  const all=[...head, cols, ...rows];
  return '\ufeff'+all.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
/* שם קובץ לפי הסינון הפעיל */
function csvFileName(){
  const clean=s=>String(s).replace(/[\\/:*?"<>|]/g,'');
  const parts=['פניות'];
  if(TF.assignee) parts.push(clean(userName(TF.assignee)));
  if(TF.arg&&ARG_LABELS[TF.arg]) parts.push(ARG_LABELS[TF.arg]);
  if(TF.domain) parts.push(DOMAINS[TF.domain].name);
  if(TF.status) parts.push(STATUSES[TF.status]);
  if(TF.city) parts.push(TF.city);
  if(TF.from||TF.to) parts.push((TF.from||'')+'_עד_'+(TF.to||'היום'));
  return parts.join('_')+(TF.from||TF.to?'':'_'+new Date().toISOString().slice(0,10))+'.csv';
}
function downloadCsv(name,csv){
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function exportTickets(){
  const list=filteredTickets(ME);
  if(!list.length){ toast('אין פניות לייצוא בסינון הנוכחי'); return; }

/* ---------- ייצוא נפרד לכל עובד (מנהל-על בלבד) ---------- */
function workersWithTickets(){
  const saved=TF.assignee, out=[];
  for(const w of DB.users.filter(x=>x.active!==false)){
    TF.assignee=w.id;
    const n=filteredTickets(ME).length;
    if(n) out.push({w,n});
  }
  TF.assignee=saved;
  return out.sort((a,b)=>b.n-a.n);
}
/* סטטיסטיקה לרשימת פניות: סה"כ, פתוחות, נסגרו בזמן, חרגו */
function ticketStats(list){
  const total=list.length;
  /* פניה בטיפול מתמשך אינה נספרת כ"פתוחה" — יש לה מועד ביצוע מתוכנן */
  const open=list.filter(t=>t.status!=='done'&&t.status!=='ongoing');
  const ongoing=list.filter(t=>t.status==='ongoing');
  const sealed=list.filter(t=>t.status==='done'||t.status==='ongoing');
  const onTime=sealed.filter(t=>slaState(t)==='ok').length;
  const lateSealed=sealed.filter(t=>slaState(t)==='late').length;
  const openLate=open.filter(t=>Date.now()>t.dueAt).length;
  const planLate=ongoing.filter(t=>t.plannedDate&&new Date(t.plannedDate+'T23:59:59').getTime()<Date.now()).length;
  const pct=n=>total?Math.round(n/total*100):0;
  return {total, open:open.length, openLate, onTime, lateDone:lateSealed, overdue:lateSealed+openLate,
          ongoing:ongoing.length, awaitingPlan:ongoing.filter(awaitingPlan).length, planLate,
          pctOnTime:pct(onTime), pctOverdue:pct(lateSealed+openLate), pctOpen:pct(open.length),
          pctOngoing:pct(ongoing.length)};
}

function workerPhone(w){
  if(w.phone) return w.phone;
  if(isTechEmail(w.email)) return w.email.replace(TECH_DOMAIN,'');
  return '';
}
function summaryWaText(w,list){
  const S=ticketStats(list);
  const period=(TF.from||TF.to)?((TF.from||'ההתחלה')+' עד '+(TF.to||'היום')):'כל התקופה';
  const lines=[
    'שלום '+w.name+',',
    '',
    'להלן ריכוז פניות המערכת שהועברו אליך בתקופה '+period+':',
    '',
    'סה"כ פניות: '+S.total,
    '✅ נסגרו בזמן: '+S.onTime+' ('+S.pctOnTime+'%)',
    '🟧 חרגו מהיעד: '+S.overdue+' ('+S.pctOverdue+'%)',
    '🔴 עדיין פתוחות: '+S.open+' ('+S.pctOpen+'%)'
  ];
  if(S.open||S.overdue){
    lines.push('','נודה להתייחסותך:');
    if(S.open) lines.push('• מה הסטטוס של הפניות שטרם נסגרו?');
    if(S.overdue) lines.push('• מה הסיבה לחריגה מזמן היעד?');
    lines.push('','נא להיכנס למערכת ולעדכן את הנדרש.');
  }else{
    lines.push('','כל הכבוד — כל הפניות נסגרו בזמן! 👏');
  }
  lines.push('','בברכה,',ORG_NAME);
  return lines.join('\n');
}
function sendWorkerSummary(userId){

  const ph=workerPhone(w);
  const url=ph?`https://wa.me/${waPhoneIntl(ph)}?text=${text}`:`https://wa.me/?text=${text}`;
  window.open(url,'_blank');
}

async function runBulkExport(){
  const btn=$('#bx_btn'); if(btn){ btn.disabled=true; }
  const rows=workersWithTickets();
  const saved=TF.assignee;
  let made=0;
  for(const {w} of rows){
    TF.assignee=w.id;
    const list=filteredTickets(ME);
    if(list.length){
      try{ downloadCsv(csvFileName(),buildTicketsCsv(list,w.name)); made++; }catch(e){}
      if(btn) btn.textContent='מוריד… '+made+' / '+rows.length;
      await new Promise(r=>setTimeout(r,450));   /* השהיה קצרה כדי שהדפדפן לא יחסום */
    }
  }
  TF.assignee=saved;
  closeModal(); render();
  toast(made+' קבצים הורדו — אחד לכל עובד');
}

function visibleTickets(u){
  let list=[...DB.tickets];
  /* מנהל-על ומוקדן רואים הכל; כל השאר - רק פניות שפתחו, שמשויכות
     אליהם, שפעלו בהן בעבר, או המקבילות לאלה (השרת אוכף זאת ממילא) */
  if(u.role==='super'||u.role==='dispatcher') return list;
  const involved=t=>t.createdBy===u.id||t.assignedTo===u.id||t.history.some(h=>h.by===u.id);
  return list.filter(t=>involved(t)||list.some(o=>involved(o)&&o.linkedTicketId===t.id));
}

/* ---------- קבצים מצורפים בפתיחת פניה ---------- */
let _ntFiles=[];
function ntAddFiles(ev){
  const files=[...ev.target.files]; if(!files.length) return;
  const bad=files.find(f=>!/^image\//.test(f.type)&&f.type!=='application/pdf');
  if(bad){ toast('ניתן לצרף תמונות ומסמכי PDF בלבד'); return; }
  const big=files.find(f=>f.size>15*1024*1024);
  if(big){ toast('קובץ גדול מדי (מקסימום 15MB): '+big.name); return; }
  _ntFiles.push(...files);
  const c=$('#nt_fcount'), l=$('#nt_flist');
  if(c) c.textContent=_ntFiles.length+' קבצים';
  if(l) l.innerHTML=_ntFiles.map(f=>(f.type==='application/pdf'?'📄 ':'🖼 ')+esc(f.name)).join(' · ');
  ev.target.value='';
}
async function uploadDocFiles(ticketId,files){
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const safe=(f.name||'doc.pdf').replace(/[^\w.\-\u0590-\u05FF]/g,'_').slice(-60);
    const path=`${ticketId}/doc_${Date.now()}_${i}_${safe}`;
    const {error:e1}=await sb.storage.from('ticket-photos').upload(path,f,{contentType:f.type||'application/pdf'});
    if(e1) throw e1;
    const {error:e2}=await sb.from('ticket_photos').insert({ticket_id:ticketId,kind:'doc',path,by_user:ME.id,file_name:f.name||''});
    if(e2) throw e2;
  }
  await addHistory(ticketId,'צירוף מסמכים',files.length+' מסמכים');
}
async function attachNtFiles(ticketId){
  if(!_ntFiles.length) return;
  const imgs=_ntFiles.filter(f=>/^image\//.test(f.type));
  const pdfs=_ntFiles.filter(f=>f.type==='application/pdf');
  if(imgs.length){
    await new Promise((res,rej)=>compressImages(imgs,async list=>{
      try{ await uploadDataUrls(ticketId,'before',list); res(); }catch(e){ rej(e); }
    }));
  }
  if(pdfs.length) await uploadDocFiles(ticketId,pdfs);
  _ntFiles=[];
}

async function doNewTicket(){
  const cname=$('#nt_cname').value.trim(), phone=$('#nt_phone').value.trim(), addr=$('#nt_addr').value.trim();
  if(!cname||!phone||!addr){ toast('יש למלא שם לקוח, טלפון וכתובת'); return; }
  const primary=$('#nt_assign').value, parallel=$('#nt_parallel').value;
  if(parallel && parallel===primary){ toast('הגורם המקביל חייב להיות שונה מהגורם הראשי'); return; }
  const btn=$('#nt_btn'); btn.disabled=true; btn.textContent='פותח פניה…';
  try{
    const base={
      domain:$('#nt_domain').value, type:$('#nt_type').value, city:$('#nt_city').value,
      customerName:cname, customerId:$('#nt_cid').value.trim(), customerPhone:phone,
      address:addr, blockNo:$('#nt_block').value.trim(), parcelNo:$('#nt_parcel').value.trim(),
      description:$('#nt_desc').value.trim()
    };
    const t=await createTicketCloud({...base, assignedTo:primary});
    try{ await attachNtFiles(t.id); }catch(e){ toast('הפניה נפתחה אך חלק מהקבצים לא הועלו — ניתן לצרפם מהכרטיס'); }
    let twin=null;

      await addHistory(t.id,'פתיחה במקביל','מקושרת לפניה '+twin.number+' אצל '+userName(parallel));
      await addHistory(twin.id,'פתיחה במקביל','מקושרת לפניה '+t.number+' אצל '+userName(primary));

    await loadAll();

    route('ticket',t.id);

function grabGPS(pref){
  if(!navigator.geolocation){ toast('אין תמיכת מיקום בדפדפן'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    _gpsTmp={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};
    const el=$('#'+pref+'_gps'); if(el) el.textContent=`נ.צ נקלט: ${_gpsTmp.lat.toFixed(5)}, ${_gpsTmp.lng.toFixed(5)}`;
    toast('המיקום נקלט');
  },()=>toast('לא ניתן לקבל מיקום — יש לאשר הרשאה'));
}
function ffAddPhoto(ev){
  const files=[...ev.target.files]; if(!files.length) return;
  compressImages(files,list=>{
    _ffPhotos.push(...list);
    const c=$('#ff_pcount'), pv=$('#ff_pprev');
    if(c) c.textContent=_ffPhotos.length+' תמונות צורפו';
    if(pv) pv.innerHTML=_ffPhotos.map(p=>`<img src="${p}">`).join('');
    toast('התמונה צורפה');
  });
}

/* ---------- תמונות: דחיסה, העלאה ל-Storage, מחיקה ---------- */
function compressImages(files,done){
  const out=[]; let left=files.length;
  if(!left){ done(out); return; }
  files.forEach(f=>{
    const img=new Image(), rd=new FileReader();
    rd.onload=()=>{ img.onload=()=>{
      const c=document.createElement('canvas'), max=1280;
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      out.push(c.toDataURL('image/jpeg',.75));
      if(--left===0) done(out);
    }; img.src=rd.result; };
    rd.readAsDataURL(f);
  });
}
function dataUrlToBlob(du){
  const [h,b64]=du.split(','), mime=h.match(/:(.*?);/)[1], bin=atob(b64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function uploadDataUrls(ticketId,kind,dataUrls){
  for(let i=0;i<dataUrls.length;i++){
    const path=`${ticketId}/${kind}_${Date.now()}_${i}.jpg`;
    const {error:e1}=await sb.storage.from('ticket-photos').upload(path,dataUrlToBlob(dataUrls[i]),{contentType:'image/jpeg'});
    if(e1) throw e1;
    const {error:e2}=await sb.from('ticket_photos').insert({ticket_id:ticketId,kind,path,by_user:ME.id});
    if(e2) throw e2;
  }
  await addHistory(ticketId,'העלאת תמונות '+(kind==='before'?'לפני':'אחרי'),dataUrls.length+' תמונות');
}
function photoButtons(id,kind){
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">
    <label class="btn btn-water btn-sm" style="margin:0">📸 צילום מצלמה
      <input type="file" accept="image/*" capture="environment" hidden onchange="addPhoto(event,'${id}','${kind}')"></label>
    <label class="btn btn-outline btn-sm" style="margin:0">🖼 העלאת קובץ
      <input type="file" accept="image/*" multiple hidden onchange="addPhoto(event,'${id}','${kind}')"></label>
  </div>`;
}
function addPhoto(ev,id,kind){
  const files=[...ev.target.files]; if(!files.length) return;
  toast('מעלה תמונות…');
  compressImages(files,async list=>{
    try{ await uploadDataUrls(id,kind,list); await loadAll(); render(); toast('התמונות הועלו לענן'); }
    catch(e){ errToast(e,'שגיאה בהעלאת התמונות'); }
  });
}
function viewPhoto(id,kind,i){
  const t=ticketById(id);

  const f4=kind.startsWith('f4:')?kind.slice(3):null;
  const p=f4?(t.f4photos||{})[f4][i]:t[kind][i];

/* ---------- צירוף ומחיקת מסמכים מהכרטיס ---------- */
function addDocToTicket(ev,id){
  const files=[...ev.target.files]; if(!files.length) return;
  const bad=files.find(f=>f.type!=='application/pdf');
  if(bad){ toast('כאן ניתן לצרף מסמכי PDF בלבד; תמונות מעלים במקטע התמונות'); return; }
  const big=files.find(f=>f.size>15*1024*1024);
  if(big){ toast('קובץ גדול מדי (מקסימום 15MB): '+big.name); return; }
  toast('מעלה מסמכים…');
  uploadDocFiles(id,files).then(async()=>{ await loadAll(); render(); toast('המסמכים צורפו'); })
    .catch(e=>errToast(e,'שגיאה בהעלאת המסמכים'));
  ev.target.value='';
}
async function delDoc(id,docId,path){
  try{
    await sb.from('ticket_photos').delete().eq('id',docId);
    await sb.storage.from('ticket-photos').remove([path]);
    await addHistory(id,'מחיקת מסמך מצורף');
    await loadAll(); render(); toast('המסמך נמחק');

}

async function delPhoto(id,kind,photoId,path){

/* ---------- פעולות על פניה ---------- */
async function setStatus(id,status){
  const t=ticketById(id);
  if(!canEdit(ME,t)){ toast('רק הגורם המטפל יכול לעדכן פניה זו'); return; }
  if(status==='done' && t.photosAfter.length===0){ toast('⚠️ לא ניתן לסמן "הושלמה" ללא תמונת "אחרי"'); return; }
  const upd={status};
  if(status==='done'&&$('#wlog')) upd.work_log=$('#wlog').value;
  const {error}=await sb.from('tickets').update(upd).eq('id',id);
  if(error){ errToast(error); return; }
  await loadAll(); render(); toast('הסטטוס עודכן: '+STATUSES[status]);
  /* אירוע משותף: אם המקבילה עדיין פתוחה, מציעים לסגור גם אותה */
  if(status==='done'){
    const lt=t.linkedTicketId?ticketById(t.linkedTicketId):null;
    if(lt&&lt.status!=='done') setTimeout(()=>offerCloseTwin(id,lt.id),400);
  }
}
/* ---------- סגירת הפניה המקבילה (אותו אירוע) ---------- */
function offerCloseTwin(srcId,twinId){
  const src=ticketById(srcId), lt=ticketById(twinId);
  if(!src||!lt) return;
  const sameOwner=lt.assignedTo===ME.id;
  showModal(`<h2>🔗 אירוע משותף — פניה מקבילה פתוחה</h2>
    <div class="alert alert-info">הפניה <b dir="ltr">${src.number}</b> נסגרה.
      הפניה המקבילה <b dir="ltr">${lt.number}</b>${lt.outage?' (הפסקת מים)':''} עדיין פתוחה${sameOwner?'':' אצל '+esc(userName(lt.assignedTo))}.
      <div style="margin-top:5px">מדובר באותו אירוע — האם לסגור גם אותה?</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-success" style="flex:1" onclick="doCloseTwin('${srcId}')">✔ סגירת ${lt.number} גם</button>
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">להשאיר פתוחה</button>
    </div>
    <div class="hint" style="margin-top:8px">התיעוד והתמונות של הפניה שנסגרה משמשים כתיעוד לשתיהן.</div>`);
}
async function doCloseTwin(srcId){
  const {data:num,error}=await sb.rpc('close_linked_twin',{source_ticket:srcId});
  if(error){
    if(/does not exist/i.test(error.message)) toast('יש להריץ קודם את תוספת ה-SQL לסגירת מקבילות');
    else errToast(error);
    return;
  }
  await loadAll(); closeModal(); render();
  toast(num?('✔ גם הפניה '+num+' נסגרה'):'הפניה המקבילה כבר סגורה');
}
async function transferTicket(id,toId){
  const t=ticketById(id), to=userById(toId);
  if(!canEdit(ME,t)){ toast('רק הגורם המטפל יכול להעביר פניה זו'); return; }
  /* אם יש הערות בשדה — משמרים אותן בהיסטוריה לפני הניקוי */
  const liveLog=($('#wlog')?.value ?? t.workLog ?? '').trim();
  const upd={assigned_to:toId, work_log:''};
  if(t.status!=='done') upd.status='open';
  const {error}=await sb.from('tickets').update(upd).eq('id',id);
  if(error){ errToast(error); return; }
  if(liveLog) await addHistory(id,'הערות '+(ME.name||''),liveLog);
  /* רישום ההעברה נכתב ע"י הטריגר בשרת (עם שמות משני הצדדים) */
  t.workLog='';
  await loadAll(); closeModal(); render(); toast('הפניה הועברה אל '+to.name);
  setTimeout(()=>offerWhatsApp(id,toId),400);
}

  const lt=t.linkedTicketId?ticketById(t.linkedTicketId):null;
  showModal(`<h2>🗑 מחיקת פניה ${t.number} <button class="x" onclick="closeModal()">×</button></h2>

      <select id="dt_scope">
        <option value="both">מחיקת שתי הפניות המקבילות (${t.number} + ${lt.number})</option>
        <option value="one">מחיקת ${t.number} בלבד — ${lt.number} תישאר ותנותק</option>
      </select></div>`:''}
    <div class="field"><label class="req">לאישור, הקלד את מספר הפניה: <b dir="ltr">${t.number}</b></label>
      <input id="dt_confirm" dir="ltr" style="text-align:left" autocomplete="off"></div>
    <div class="field"><label>סיבת המחיקה (יתועד ביומן)</label>
      <select id="dt_reason"><option>פניית הדגמה / בדיקה</option><option>פניה כפולה</option><option>נפתחה בטעות</option><option>אחר</option></select></div>
    <button class="btn btn-danger btn-block" id="dt_btn" onclick="doDeleteTicket('${id}')">מחיקה סופית</button>`);

async function doDeleteTicket(id){
  const t=ticketById(id), m=$('#dt_confirm'), btn=$('#dt_btn');
  if((m.value||'').trim().toUpperCase()!==t.number.toUpperCase()){
    toast('מספר הפניה שהוקלד אינו תואם — המחיקה בוטלה');
    return;
  }
  const scope=$('#dt_scope')?.value||'one';
  const reason=$('#dt_reason').value;
  btn.disabled=true; btn.textContent='מוחק…';
  let allPaths=[];
  try{
    /* מחיקת המקבילה תחילה, אם נבחר "שתיהן" */
    if(scope==='both'&&t.linkedTicketId){
      const {data:p2,error:e2}=await sb.rpc('admin_delete_ticket',{target_ticket:t.linkedTicketId,del_reason:reason+' (מחיקה זוגית)'});
      if(e2) throw e2;
      allPaths.push(...(p2||[]));
    }
    const {data:p1,error:e1}=await sb.rpc('admin_delete_ticket',{target_ticket:id,del_reason:reason});
    if(e1) throw e1;
    allPaths.push(...(p1||[]));
  }catch(error){
    btn.disabled=false; btn.textContent='מחיקה סופית';
    if(/does not exist/i.test(error.message)) toast('יש להריץ קודם את תוספת ה-SQL למחיקת פניות (הגרסה המעודכנת)');
    else errToast(error);
    return;
  }
  /* ניקוי קובצי התמונות מהאחסון */
  if(allPaths.length){
    try{ await sb.storage.from('ticket-photos').remove(allPaths); }catch(e){}
  }
  await loadAll(); closeModal(); route('tickets');
  toast(scope==='both'?'שתי הפניות המקבילות נמחקו ותועדו ביומן':'הפניה '+t.number+' נמחקה; המקבילה נותקה והפכה עצמאית');
}

  </div>`;
}
function f4AddPhotos(ev,id,kind){
  const files=[...ev.target.files]; if(!files.length) return;
  toast('מעלה תמונות…');
  compressImages(files,async list=>{
    try{ await uploadDataUrls(id,kind,list); await loadAll(); render(); toast('התמונות נוספו'); }
    catch(e){ errToast(e,'שגיאה בהעלאת התמונות'); }

  ev.target.value='';

async function f4Save(id){
  const v=s=>($('#'+s)?.value||'').trim();
  const data={
    mainInstalled:v('f4_mainInstalled'), mainNo:v('f4_mainNo'), mainDia:v('f4_mainDia'),
    meterLoc:v('f4_meterLoc'), mainPerSpec:v('f4_mainPerSpec'), mainDeviation:v('f4_mainDeviation'),
    pressure:v('f4_pressure'),
    subMeters:F4_SUBS.filter(s=>(s.no||'').trim()||(s.dia||'').trim()),
    use:v('f4_use'), useOther:v('f4_useOther'),
    fireType:v('f4_fireType'), fireOther:v('f4_fireOther'), fireConnected:v('f4_fireConnected'),
    fireBackflow:v('f4_fireBackflow'), fireBackflowNo:v('f4_fireBackflowNo'), fireBackflowValid:v('f4_fireBackflowValid'),
    sewageConnected:v('f4_sewageConnected'), sewageOk:v('f4_sewageOk'), sewageIssue:v('f4_sewageIssue'),
    drainToSewage:v('f4_drainToSewage'),
    pool:v('f4_pool'), poolBackflow:v('f4_poolBackflow'), poolWaterNote:v('f4_poolWaterNote'),
    poolToSewage:v('f4_poolToSewage'), poolConn:v('f4_poolConn'),
    notes:v('f4_notes')
  };
  const {error}=await sb.from('tickets').update({form4:data}).eq('id',id);
  if(error){
    if(/form4/.test(error.message)) toast('יש להריץ קודם את תוספת ה-SQL של טופס 4');
    else errToast(error);
    return;
  }
  ticketById(id).form4=data;
  await addHistory(id,'עדכון ממצאי בדיקה — טופס 4');
  await loadAll(); render(); toast('✔ הממצאים נשמרו — אפשר להמשיך לערוך בהמשך');
}

async function doOngoing(id){
  const reason=($('#og_reason')?.value||'').trim();
  if(!reason){ toast('יש לפרט מה נדרש להשלמת הטיפול'); return; }
  const btn=$('#og_btn'); if(btn){ btn.disabled=true; btn.textContent='מעדכן…'; }
  const mode=($('#og_mode')?.value||'self');
  const owner=mode==='transfer'?($('#og_owner')?.value||'').trim():ME.id;
  if(mode==='transfer'&&!owner){ toast('יש לבחור מנהלן לקביעת מועד הביצוע'); if(btn){btn.disabled=false;btn.textContent='העברה לטיפול מתמשך';} return; }
  const t=ticketById(id), now=new Date().toISOString();
  const upd={status:'ongoing',ongoing_at:now,ongoing_reason:reason,ongoing_owner:owner};
  if(mode==='transfer') upd.assigned_to=owner;   /* ניהול עצמי: הפניה נשארת אצל המסמן */
  const {error}=await sb.from('tickets').update(upd).eq('id',id);
  if(error){
    if(btn){ btn.disabled=false; btn.textContent='העברה לטיפול מתמשך'; }
    if(/ongoing|status_check/.test(error.message)) toast('יש להריץ קודם את תוספת ה-SQL של טיפול מתמשך');
    else errToast(error);
    return;
  }
  await addHistory(id,'העברה לטיפול מתמשך',reason+' · '+(mode==='transfer'?'הועבר ל'+userName(owner):'בניהול עצמי של '+userName(owner))+' · מענה ראשוני '+(slaState(t)==='ok'?'בתוך היעד':'באיחור'));
  await loadAll(); closeModal(); render();
  toast(mode==='transfer'?('הפניה הועברה לטיפול מתמשך אל '+userName(owner)):'הפניה סומנה כטיפול מתמשך — נותרה בניהולך');
}

/* ---------- דוחות ---------- */
let REP_FROM='', REP_TO='';
function repPreset(p){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const fmt=d=>d.toISOString().slice(0,10);
  if(p==='month'){ REP_FROM=fmt(new Date(y,m,1)); REP_TO=fmt(new Date(y,m+1,0)); }
  else if(p==='prev'){ REP_FROM=fmt(new Date(y,m-1,1)); REP_TO=fmt(new Date(y,m,0)); }
  else if(p==='quarter'){ REP_FROM=fmt(new Date(now.getTime()-90*864e5)); REP_TO=fmt(now); }
  else if(p==='year'){ REP_FROM=fmt(new Date(y,0,1)); REP_TO=fmt(now); }
  else { REP_FROM=''; REP_TO=''; }
  render();
}
function repApplyDates(){ REP_FROM=$('#rep_from').value; REP_TO=$('#rep_to').value; render(); }
function repInRange(t){
  const d=t.createdAt;
  if(REP_FROM && d < new Date(REP_FROM+'T00:00:00').getTime()) return false;
  if(REP_TO && d > new Date(REP_TO+'T23:59:59').getTime()) return false;
  return true;
}
function vReports(u){
  const T=DB.tickets.filter(repInRange);
  const rangeLabel=(!REP_FROM&&!REP_TO)?'כל התקופה':((REP_FROM||'ההתחלה')+' — '+(REP_TO||'היום'));
  const byStatus=['open','progress','done'].map(s=>({s,n:T.filter(t=>t.status===s).length}));
  const byDomain=Object.keys(DOMAINS).map(d=>({d,n:T.filter(t=>t.domain===d).length}));
  const byCity=CITIES.map(c=>({c,n:T.filter(t=>t.city===c).length})).filter(x=>x.n>0);
  const done=T.filter(t=>t.status==='done');
  const avgMs=done.length?done.reduce((a,t)=>a+(t.completedAt-t.createdAt),0)/done.length:0;
  /* תפוקה: כל אנשי השטח והקבלנים הרשומים הפעילים — כולל מי שעם 0 פניות */
  const output=DB.users
    .filter(w=>(w.role==='field'||w.role==='contractor')&&w.active!==false)
    .map(w=>{
      const mine=done.filter(t=>t.assignedTo===w.id);
      const inSLA=mine.filter(t=>t.completedAt<=t.dueAt).length;
      const avg=mine.length?mine.reduce((a,t)=>a+(t.completedAt-t.createdAt),0)/mine.length:0;

      return {w,total:mine.length,inSLA,avg,openN};
    })

      <table class="rep">${byStatus.map(x=>`<tr><td>${STATUSES[x.s]}</td><td><b>${x.n}</b></td></tr>`).join('')}

    <div class="card"><div class="section-t">🧭 חתכים</div>

  <div class="card" style="margin-bottom:14px">

    <table class="rep"><tr><th>עובד</th><th>פתוחות כעת</th><th>הושלמו</th><th>בתוך היעד</th><th>זמן ממוצע</th><th>עמידה ביעד</th></tr>
      ${output.map(x=>`<tr${x.total===0&&x.openN===0?' style="opacity:.5"':''}><td><b>${esc(x.w.name)}</b>${x.w.role==='contractor'?' <span class="chip chip-transfer" style="font-size:10px">קבלן</span>':''}</td>

        const over=t.plannedDate&&new Date(t.plannedDate+'T23:59:59').getTime()<Date.now();
        return `<tr style="${!t.plannedDate?'background:#FEF2F2':(over?'background:#FFF7ED':'')}">

          <td>${esc(userName(t.assignedTo))}</td>

      }).join('')}</table>

  </div>`;})()}
  ${(()=>{
    const late=T.filter(t=>t.status==='done'&&t.completedAt>t.dueAt);
    if(!late.length) return '';
    const counts={}; let noReason=0;
    late.forEach(t=>{ if(t.breachReason) counts[t.breachReason]=(counts[t.breachReason]||0)+1; else noReason++; });
    const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const pct=n=>Math.round(n/late.length*100);
    return `
  <div class="card" style="margin-top:14px">
    <div class="section-t">🟧 סיבות לחריגה מיעד (${late.length} פניות שנסגרו באיחור)</div>

    </table>
    <div class="hint" style="margin-top:5px">סיבות המסומנות "דיווח" מעידות על פער בתיעוד ולא בהכרח על חריגה תפעולית אמיתית.</div>

}

async function saveCities(id){
  const cities=[...document.querySelectorAll('[data-city]')].filter(c=>c.checked).map(c=>c.dataset.city);
  const work_areas=[...document.querySelectorAll('[data-area]')].filter(c=>c.checked).map(c=>c.dataset.area);
  const {error}=await sb.from('profiles').update({cities,work_areas}).eq('id',id);
  if(error){
    if(/column .*(cities|work_areas).* does not exist/i.test(error.message)) toast('יש להריץ קודם את תוספות ה-SQL של הישובים והתחומים');

    return;
  }
  const w=userById(id); w.cities=cities; w.workAreas=work_areas;
  closeModal(); render();
  toast(w.name+' עודכן');
}

/* ---------- עריכת פרטי משתמש (מנהל-על) ---------- */
function openEditUser(id){
  const w=userById(id), tech=isTechEmail(w.email);
  showModal(`<h2>✏️ עריכת ${esc(w.name)} <button class="x" onclick="closeModal()">×</button></h2>
    <div id="msg"></div>
    <div class="field"><label class="req">שם מלא</label><input id="eu_name" value="${esc(w.name)}"></div>
    ${tech
      ?`<div class="field"><label class="req">מספר טלפון (משמש לכניסה)</label>
          <input id="eu_phone" type="tel" dir="ltr" style="text-align:left" inputmode="numeric" value="${esc(w.phone||w.email.replace(TECH_DOMAIN,''))}">
          <div class="hint">שינוי המספר מעדכן גם את פרטי הכניסה — העובד ייכנס מעתה עם המספר החדש (הסיסמה נשארת).</div></div>`
      :`<div class="field"><label class="req">דוא"ל (משמש לכניסה)</label>
          <input id="eu_email" type="email" dir="ltr" style="text-align:left" value="${esc(w.email)}">
          <div class="hint">שינוי הכתובת מעדכן את פרטי הכניסה — העובד ייכנס מעתה עם הכתובת החדשה (הסיסמה נשארת).</div></div>
        <div class="field"><label>טלפון</label><input id="eu_phone" type="tel" dir="ltr" style="text-align:left" value="${esc(w.phone||'')}"></div>`}
    <button class="btn btn-primary btn-block" id="eu_btn" onclick="saveEditUser('${id}',${tech})">שמירת שינויים</button>`);
}
async function saveEditUser(id,tech){
  const w=userById(id), m=$('#msg'), btn=$('#eu_btn');
  const name=$('#eu_name').value.trim(), phone=normPhone($('#eu_phone')?.value||'');
  if(!name){ m.innerHTML='<div class="alert alert-err">יש למלא שם.</div>'; return; }
  btn.disabled=true; btn.textContent='שומר…';
  try{
    let newEmail=null;
    if(tech){
      if(!phoneValid(phone)) throw new Error('מספר טלפון לא תקין (למשל 0501234567)');
      const t=phoneToEmail(phone);
      if(t!==w.email) newEmail=t;
    }else{
      const em=$('#eu_email').value.trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) throw new Error('כתובת דוא"ל לא תקינה');
      if(em!==w.email.toLowerCase()) newEmail=em;
    }
    if(newEmail){
      const {error}=await sb.rpc('admin_update_user_email',{target_user:id,new_email:newEmail});
      if(error){
        if(/does not exist/i.test(error.message)) throw new Error('יש להריץ קודם את תוספת ה-SQL לעריכת משתמשים');
        throw error;
      }
      w.email=newEmail;
    }
    const {error:e2}=await sb.from('profiles').update({name,phone}).eq('id',id);
    if(e2) throw e2;
    w.name=name; w.phone=phone;
    closeModal(); render(); toast('הפרטים של '+name+' עודכנו');
  }catch(e){
    btn.disabled=false; btn.textContent='שמירת שינויים';
    m.innerHTML=`<div class="alert alert-err">${esc(e.message)}</div>`;
  }
}

async function setRole(id,role){
  const {error}=await sb.from('profiles').update({role}).eq('id',id);
  if(error){ errToast(error); render(); return; }
  const w=userById(id); w.role=role; toast(w.name+' עודכן ל'+ROLES[role]); render();
}

/* ---------- השבתה / הפעלה / מחיקה ---------- */
async function toggleActive(id,active){
  const w=userById(id);
  if(!active){
    const open=DB.tickets.filter(t=>t.assignedTo===id&&t.status!=='done');
    if(open.length){
      showModal(`<h2>⚠️ השבתת ${esc(w.name)} <button class="x" onclick="closeModal()">×</button></h2>
        <div class="alert alert-err">לעובד יש ${open.length} פניות פתוחות. מומלץ להעביר אותן לגורם אחר לפני ההשבתה (דרך כרטיס כל פניה), אחרת הן יישארו ללא מטפל זמין.</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-warn" style="flex:1" onclick="doToggleActive('${id}',false)">להשבית בכל זאת</button>
          <button class="btn btn-outline" style="flex:1" onclick="closeModal()">ביטול</button>
        </div>`);
      return;
    }
  }
  doToggleActive(id,active);
}
async function doToggleActive(id,active){
  const {error}=await sb.from('profiles').update({active}).eq('id',id);
  if(error){ errToast(error); return; }
  const w=userById(id); w.active=active;
  closeModal(); render();
  toast(w.name+(active?' הופעל מחדש':' הושבת — לא יוכל להתחבר או לעדכן פניות'));
}

/* איפוס סיסמה זמנית לעובד־טלפון — דרך פונקציה מאובטחת בשרת (מנהל־על בלבד) */
async function tempResetPass(id){
  const w=userById(id);
  const tmp='Aa'+Math.floor(100000+Math.random()*900000);
  const {error}=await sb.rpc('admin_reset_password',{target_user:id,new_password:tmp});
  if(error){
    if(/function .*admin_reset_password.* does not exist/i.test(error.message))
      toast('יש להריץ קודם את תוספת ה-SQL לאיפוס סיסמאות (ראה הנחיות)');
    else errToast(error);
    return;
  }
  showModal(`<h2>סיסמה זמנית <button class="x" onclick="closeModal()">×</button></h2>
    <div class="alert alert-ok">הסיסמה של <b>${esc(w.name)}</b> אופסה. סיסמה זמנית:</div>
    <div style="text-align:center;font-size:24px;font-weight:800;letter-spacing:2px" dir="ltr">${tmp}</div>
    <div class="hint" style="text-align:center;margin-top:8px">מסרו לעובד בעל־פה או בהודעה. מומלץ שיחליף אותה לאחר הכניסה.</div>`);
}

/* ---------- הוספת משתמש ע"י מנהל העל ---------- */
/* נעשה שימוש בלקוח משני שאינו שומר סשן, כדי שההרשמה לא תנתק את מנהל העל */
function openAddUser(){
  showModal(`<h2>➕ הוספת משתמש חדש <button class="x" onclick="closeModal()">×</button></h2>
    <div id="msg"></div>
    <div class="field"><label class="req" for="au_name">שם מלא</label><input id="au_name"></div>
    <div class="field"><label class="req">זיהוי לכניסה</label>
      <select id="au_idtype" onchange="$('#au_email_row').hidden=this.value!=='email';$('#au_phone_lbl').textContent=this.value==='phone'?'מספר טלפון (ישמש לכניסה)':'טלפון'">
        <option value="phone">מספר טלפון (לעובד ללא מייל ארגוני)</option>
        <option value="email">כתובת דוא"ל</option>
      </select></div>
    <div class="field" id="au_email_row" hidden><label class="req" for="au_email">דוא"ל</label><input type="email" id="au_email" dir="ltr" style="text-align:left"></div>
    <div class="field"><label class="req" id="au_phone_lbl" for="au_phone">מספר טלפון (ישמש לכניסה)</label><input type="tel" id="au_phone" dir="ltr" style="text-align:left" inputmode="numeric" placeholder="050-1234567"></div>
    <div class="field"><label class="req">רמת הרשאה</label>
      <select id="au_role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k==='field'?'selected':''}>${v}</option>`).join('')}</select></div>
    ${pwField('au_pass','סיסמה ראשונית','new-password')}
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn btn-outline btn-sm" onclick="genAuPass()">🎲 הגרלת סיסמה ראשונית</button>
    </div>
    <button class="btn btn-primary btn-block" id="au_btn" onclick="doAddUser()">יצירת משתמש</button>
    <div class="hint" style="margin-top:8px">מסרו לעובד את פרטי הכניסה (טלפון/דוא"ל + סיסמה ראשונית). עובד־טלפון ששכח סיסמה יקבל ממך סיסמה זמנית ממסך זה.</div>`);
}
function genAuPass(){
  const p='Aa'+Math.floor(100000+Math.random()*900000);
  const inp=$('#au_pass'); inp.value=p; inp.type='text';
  inp.dispatchEvent(new Event('input'));
  const eye=document.querySelector('[data-eye="au_pass"]'); if(eye) eye.textContent='🙈';
}
async function doAddUser(){
  const name=$('#au_name').value.trim(), idtype=$('#au_idtype').value,
        phone=$('#au_phone').value.trim(),
        role=$('#au_role').value, pass=$('#au_pass').value, m=$('#msg'), btn=$('#au_btn');
  let email;
  if(idtype==='phone'){
    if(!name){ m.innerHTML='<div class="alert alert-err">יש למלא שם.</div>'; return; }
    if(!phoneValid(phone)){ m.innerHTML='<div class="alert alert-err">מספר טלפון לא תקין (למשל 0501234567).</div>'; return; }
    email=phoneToEmail(phone);
  }else{
    email=$('#au_email').value.trim().toLowerCase();
    if(!name||!email){ m.innerHTML='<div class="alert alert-err">יש למלא שם ודוא"ל.</div>'; return; }
  }
  if(!passOK(pass)){ m.innerHTML='<div class="alert alert-err">סיסמה: 8 תווים לפחות, חובה אותיות באנגלית ומספרים.</div>'; return; }
  btn.disabled=true; btn.textContent='יוצר משתמש…';
  try{
    const tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,storageKey:'hari_tmp_signup',autoRefreshToken:false}});
    const {data,error}=await tmp.auth.signUp({email,password:pass,options:{data:{name,phone:normPhone(phone)}}});
    if(error) throw error;
    const newId=data.user?.id;
    if(newId){
      for(let i=0;i<6;i++){
        const {data:p}=await sb.from('profiles').select('id').eq('id',newId).maybeSingle();
        if(p){
          const upd={phone:normPhone(phone)};
          if(role!=='field') upd.role=role;
          await sb.from('profiles').update(upd).eq('id',newId);
          break;
        }
        await new Promise(r=>setTimeout(r,700));
      }
    }
    await loadAll(); closeModal(); render();
    toast('המשתמש '+name+' נוסף ('+ROLES[role]+')'+(data.session?'':' — ייתכן שיידרש אישור מייל'));
  }catch(e){
    btn.disabled=false; btn.textContent='יצירת משתמש';
    const t=/already registered/i.test(e.message)?(idtype==='phone'?'מספר טלפון זה כבר רשום במערכת.':'דוא"ל זה כבר רשום במערכת.'):e.message;
    m.innerHTML=`<div class="alert alert-err">${esc(t)}</div>`;
  }
}

/* ================= אתחול ================= */
/* ================= אתחול ================= */
/* זיהוי מוקדם של חזרה מקישור איפוס סיסמה — לפני כל ניתוב */
if(/type=recovery/.test(location.hash)||/type=recovery/.test(location.search)) RECOVERY=true;
sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){ RECOVERY=true; route('reset'); }
});
(async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(RECOVERY){ route('reset'); return; }
  if(session){ await afterAuth(); } else { route('landing'); }
})();
/* רענון נתונים שקט כל דקה במסכי צפייה (לא בטפסים) */
setInterval(async()=>{
  try{ checkEndOfDay(); }catch(e){}
  /* לא מרעננים בזמן הקלדה בשדה, כדי לא לקטוע את המשתמש */
  const typing=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if(ME&&['home','tickets','board','reports','map'].includes(VIEW.name)&&!document.querySelector('.modal-bg')&&!typing){
    await loadAll(); render();
  }
},60000);
</script>
